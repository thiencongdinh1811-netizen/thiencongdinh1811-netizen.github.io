<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tickets | Bảng điều khiển</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#0f192b;
    color:#f5f7fb;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   MÀU
========================= */

:root{
    --bg:#0f192b;
    --sidebar:#1c293b;
    --top:#111c2e;
    --card:#1e2a3d;
    --card2:#202e43;
    --input:#3a485d;
    --border:#35445a;
    --blue:#2166f3;
    --blue2:#5865f2;
    --green:#23a55a;
    --red:#ed4245;
    --yellow:#faa61a;
    --muted:#b5c2d5;
}

/* =========================
   ĐĂNG NHẬP
========================= */

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 20%,
            #172746,
            #080d17 70%
        );
}

.loginbox{
    width:min(430px,92vw);
    padding:42px;
    background:#181f2b;
    border:1px solid #394456;
    border-radius:16px;
    text-align:center;
    box-shadow:0 20px 70px #0008;
}

.logo{
    width:82px;
    height:82px;
    border-radius:50%;
    margin:auto;
    display:grid;
    place-items:center;
    background:#5865f2;
    font-size:42px;
    font-weight:900;
}

.loginbox h1{
    margin:24px 0 10px;
}

.loginbox p{
    color:#aebbd0;
    line-height:1.7;
}

.loginbtn{
    width:100%;
    margin-top:18px;
}

/* =========================
   BUTTON
========================= */

.primary,
.secondary,
.success,
.danger{
    border:0;
    border-radius:6px;
    padding:10px 16px;
    color:white;
    font-weight:700;
}

.primary{
    background:#2166f3;
}

.primary:hover{
    background:#3b7cff;
}

.secondary{
    background:#46546a;
}

.secondary:hover{
    background:#53647c;
}

.success{
    background:#23a55a;
}

.success:hover{
    background:#2bc76c;
}

.danger{
    background:#ed4245;
}

.danger:hover{
    background:#ff5a5d;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
    display:flex;
}

.side{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:80px;
    background:var(--sidebar);
    border-right:1px solid #2c3a4d;
    z-index:20;
}

.brand{
    height:82px;
    display:grid;
    place-items:center;
    font-size:26px;
    border-bottom:1px solid #2d3a4e;
}

.nav{
    padding-top:8px;
}

.nav button{
    position:relative;
    width:100%;
    height:64px;
    border:0;
    border-left:3px solid transparent;
    background:transparent;
    color:#fff;
    font-size:22px;
}

.nav button:hover,
.nav button.active{
    background:#24344b;
    border-left-color:#2775ff;
}

/* TOOLTIP */

.nav button[data-tip]::after{
    content:attr(data-tip);
    position:absolute;
    left:72px;
    top:50%;
    transform:translateY(-50%);
    background:#111827;
    color:#fff;
    padding:9px 13px;
    border-radius:6px;
    font-size:14px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.15s;
    box-shadow:0 8px 25px #0008;
    z-index:100;
}

.nav button[data-tip]:hover::after{
    opacity:1;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:80px;
    width:calc(100% - 80px);
    min-height:100vh;
}

.top{
    height:70px;
    background:var(--top);
    border-bottom:1px solid #27364b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.server-select{
    background:#35445a;
    border:1px solid #506078;
    color:white;
    border-radius:6px;
    padding:10px 13px;
    min-width:280px;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.content{
    max-width:1160px;
    margin:auto;
    padding:34px 30px 80px;
}

.title{
    text-align:center;
    margin:8px 0 6px;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#b8c5d7;
    margin-bottom:34px;
}

/* =========================
   CARD
========================= */

.card{
    background:var(--card);
    border:1px solid #25354b;
    border-radius:12px;
    margin:22px 0;
    overflow:hidden;
}

.cardhead{
    min-height:70px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid #35445a;
}

.cardhead h2{
    margin:0;
    font-size:21px;
}

.body{
    padding:20px;
}

.actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================
   FORM
========================= */

.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:8px;
    font-weight:700;
}

.input,
.select,
.textarea{
    width:100%;
    background:var(--input);
    border:1px solid #506078;
    color:white;
    border-radius:6px;
    padding:11px 12px;
    outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:#6f92ff;
}

.textarea{
    min-height:130px;
    resize:vertical;
}

/* =========================
   TABLE
========================= */

.tablewrap{
    overflow-x:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:13px;
    border-bottom:1px solid #344359;
    text-align:left;
}

.table th{
    color:#b8c5d7;
    font-size:13px;
    text-transform:uppercase;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    background:#46546a;
    font-size:12px;
}

/* =========================
   PANEL
========================= */

.panelrow{
    display:grid;
    grid-template-columns:1.2fr 1fr .7fr .8fr auto;
    gap:8px;
    align-items:center;
    padding:14px 8px;
    border-bottom:1px solid #344359;
}

.panelrow.head{
    color:#b8c5d7;
    font-size:12px;
    text-transform:uppercase;
}

.smallbtn{
    border:0;
    background:#46546a;
    color:white;
    padding:8px 11px;
    border-radius:5px;
}

.empty{
    text-align:center;
    padding:55px 20px;
    color:#aebbd0;
}

.empty h3{
    color:white;
    font-size:20px;
}

/* =========================
   LIST
========================= */

.list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.listitem{
    background:#26364b;
    padding:13px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:grid;
    place-items:center;
    z-index:100;
    padding:20px;
}

.modalbox{
    width:min(820px,96vw);
    max-height:92vh;
    overflow:auto;
    background:#1b2739;
    border:1px solid #45566e;
    border-radius:10px;
    box-shadow:0 20px 80px #000c;
}

.modalhead{
    padding:18px 20px;
    border-bottom:1px solid #3b4a60;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modalhead h2{
    margin:0;
}

.modalbody{
    padding:22px;
}

.closex{
    border:0;
    background:transparent;
    color:white;
    font-size:28px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    max-width:420px;
    background:#222e42;
    border:1px solid #53637a;
    padding:13px 18px;
    border-radius:7px;
    z-index:200;
    box-shadow:0 10px 35px #0008;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:80px 20px;
}

.spinner{
    width:42px;
    height:42px;
    margin:0 auto 15px;
    border:4px solid #394a61;
    border-top-color:#5865f2;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .side{
        width:58px;
    }

    .main{
        margin-left:58px;
        width:calc(100% - 58px);
    }

    .grid2{
        grid-template-columns:1fr;
    }

    .panelrow{
        grid-template-columns:1fr;
        gap:7px;
    }

    .top{
        padding:0 12px;
    }

    .server-select{
        min-width:160px;
        max-width:55vw;
    }

    .content{
        padding:20px 12px 60px;
    }

    .user span{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login">

    <div class="loginbox">

        <div class="logo">🎫</div>

        <h1>Tickets</h1>

        <p>
            Đăng nhập bằng Discord để quản lý
            server, ticket, transcript, panel
            và hệ thống hỗ trợ.
        </p>

        <button
            id="loginButton"
            class="primary loginbtn"
            type="button"
        >
            🎮 Đăng nhập bằng Discord
        </button>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app hidden">

    <aside class="side">

        <div class="brand">
            🎫
        </div>

        <div class="nav">

            <button
                data-page="tickets"
                data-tip="Ticket"
                type="button"
            >
                🎟️
            </button>

            <button
                data-page="transcripts"
                data-tip="Transcript"
                type="button"
            >
                🧾
            </button>

            <button
                data-page="panels"
                data-tip="Panel"
                type="button"
            >
                ▣
            </button>

            <button
                data-page="teams"
                data-tip="Nhóm hỗ trợ"
                type="button"
            >
                👥
            </button>

            <button
                data-page="blacklist"
                data-tip="Danh sách chặn"
                type="button"
            >
                ⛔
            </button>

            <button
                data-page="audit-log"
                data-tip="Nhật ký hoạt động"
                type="button"
            >
                ↶
            </button>

            <button
                data-page="settings"
                data-tip="Cài đặt"
                type="button"
            >
                ⚙️
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="top">

            <select
                id="serverSelect"
                class="server-select"
            ></select>

            <div class="user">

                <img
                    id="userAvatar"
                    class="avatar"
                    alt="Avatar"
                >

                <span id="userName"></span>

            </div>

        </header>


        <section
            id="content"
            class="content"
        ></section>

    </main>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal hidden"
></div>


<!-- TOAST -->

<div
    id="toast"
    class="toast hidden"
></div>


<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const API =
    "https://imcongthienzz.freesrv.com";


/* =========================================================
   BIẾN
========================================================= */

let TOKEN =
    localStorage.getItem("dashboard_token") || "";

let ME = null;

let GUILDS = [];

let GUILD = null;

let DATA = {};


/* =========================================================
   DOM
========================================================= */

const loginEl =
    document.getElementById("login");

const appEl =
    document.getElementById("app");

const content =
    document.getElementById("content");

const modal =
    document.getElementById("modal");

const toastEl =
    document.getElementById("toast");

const serverSelect =
    document.getElementById("serverSelect");

const userName =
    document.getElementById("userName");

const userAvatar =
    document.getElementById("userAvatar");

const loginButton =
    document.getElementById("loginButton");


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            }[char])
        );

}


/* =========================================================
   LẤY VALUE
========================================================= */

function val(id){

    const el =
        document.getElementById(id);

    return el
        ? el.value
        : "";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function toast(message){

    clearTimeout(toastTimer);

    toastEl.textContent =
        message;

    toastEl.classList.remove(
        "hidden"
    );

    toastTimer =
        setTimeout(
            () => {
                toastEl.classList.add(
                    "hidden"
                );
            },
            3000
        );

}


/* =========================================================
   API
========================================================= */

async function api(path, options = {}){

    const headers = {
        ...(options.headers || {}),
        "Content-Type":
            "application/json"
    };

    if(TOKEN){

        headers.Authorization =
            "Bearer " + TOKEN;

    }

    let response;

    try{

        response =
            await fetch(
                API + path,
                {
                    ...options,
                    headers
                }
            );

    }catch(error){

        throw new Error(
            "Không thể kết nối máy chủ."
        );

    }


    let data = {};

    try{

        data =
            await response.json();

    }catch{

        data = {};

    }


    if(
        response.status === 401
    ){

        clearLogin();

        throw new Error(
            "Phiên đăng nhập đã hết hạn."
        );

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            "Máy chủ trả về lỗi."
        );

    }


    return data;

}


/* =========================================================
   LƯU ĐĂNG NHẬP
========================================================= */

function saveLogin(token){

    TOKEN = token;

    localStorage.setItem(
        "dashboard_token",
        token
    );

}


/* =========================================================
   XÓA ĐĂNG NHẬP
========================================================= */

function clearLogin(){

    TOKEN = "";

    ME = null;

    GUILDS = [];

    GUILD = null;

    localStorage.removeItem(
        "dashboard_token"
    );

}


/* =========================================================
   ĐĂNG NHẬP
========================================================= */

function login(){

    window.location.href =
        API + "/auth/discord";

}


/* =========================================================
   ĐĂNG XUẤT
========================================================= */

async function logout(){

    try{

        await api(
            "/api/logout",
            {
                method:"POST"
            }
        );

    }catch{}

    clearLogin();

    window.location.hash = "";

    showLogin();

}


/* =========================================================
   HIỂN THỊ LOGIN
========================================================= */

function showLogin(){

    loginEl.classList.remove(
        "hidden"
    );

    appEl.classList.add(
        "hidden"
    );

}


/* =========================================================
   HIỂN THỊ APP
========================================================= */

function showApp(){

    loginEl.classList.add(
        "hidden"
    );

    appEl.classList.remove(
        "hidden"
    );

}


/* =========================================================
   ROUTE
========================================================= */

function route(){

    const raw =
        location.hash
            .slice(1)
            .split("/");

    if(
        raw[0] === "manage"
    ){

        return {
            guildId: raw[1],
            page: raw[2] || "panels"
        };

    }

    return {
        page:"servers"
    };

}


/* =========================================================
   ĐI TỚI TRANG
========================================================= */

function go(page){

    if(!GUILD){

        return;

    }

    location.hash =
        `manage/${GUILD.id}/${page}`;

}


/* =========================================================
   GUILDS
========================================================= */

async function loadGuilds(){

    const result =
        await api("/api/guilds");

    GUILDS =
        Array.isArray(result.guilds)
            ? result.guilds
            : [];

    renderServerSelect();

}


/* =========================================================
   SERVER SELECT
========================================================= */

function renderServerSelect(){

    serverSelect.innerHTML = GUILDS
        .map(
            guild => `
                <option value="${esc(guild.id)}">
                    ${esc(guild.name)}
                    ${guild.botInstalled
                        ? ""
                        : " — Bot chưa vào server"}
                </option>
            `
        )
        .join("");

    serverSelect.onchange =
        () => {

            selectGuild(
                serverSelect.value,
                true
            );

        };

}


/* =========================================================
   CHỌN SERVER
========================================================= */

async function selectGuild(
    guildId,
    changePage = true
){

    const selected =
        GUILDS.find(
            guild =>
                guild.id === guildId
        );

    if(!selected){

        return showServers();

    }


    if(!selected.botInstalled){

        toast(
            "Bot chưa vào server này."
        );

        return;

    }


    try{

        const result =
            await api(
                `/api/guild/${guildId}`
            );

        GUILD = {
            ...selected,
            ...(result.guild || {})
        };

        serverSelect.value =
            guildId;

        showApp();

        if(changePage){

            go("panels");

        }

    }catch(error){

        toast(error.message);

    }

}


/* =========================================================
   TRANG SERVER
========================================================= */

function showServers(){

    showApp();

    content.innerHTML = `

        <h1 class="title">
            Server của bạn
        </h1>

        <p class="subtitle">
            Chọn server để quản lý
        </p>

        <div class="grid2">

            ${
                GUILDS.map(
                    guild => `
                        <div class="card">

                            <div class="body">

                                <div
                                    style="
                                        display:flex;
                                        gap:15px;
                                        align-items:center
                                    "
                                >

                                    <img
                                        class="avatar"
                                        style="
                                            width:58px;
                                            height:58px
                                        "
                                        src="${
                                            guild.icon ||
                                            "https://cdn.discordapp.com/embed/avatars/0.png"
                                        }"
                                        alt=""
                                    >

                                    <div>

                                        <h2>
                                            ${esc(guild.name)}
                                        </h2>

                                        <div
                                            style="
                                                color:#b5c2d5
                                            "
                                        >
                                            ${
                                                guild.botInstalled
                                                ? "🟢 Bot đang ở server"
                                                : "⚪ Bot chưa ở server"
                                            }
                                        </div>

                                    </div>

                                </div>


                                <button
                                    class="${
                                        guild.botInstalled
                                        ? "primary"
                                        : "secondary"
                                    }"
                                    style="
                                        width:100%;
                                        margin-top:18px
                                    "
                                    ${
                                        guild.botInstalled
                                        ? ""
                                        : "disabled"
                                    }
                                    type="button"
                                    onclick="
                                        selectGuild(
                                            '${guild.id}',
                                            true
                                        )
                                    "
                                >
                                    ${
                                        guild.botInstalled
                                        ? "⚙️ Quản lý server"
                                        : "➕ Bot chưa vào server"
                                    }
                                </button>

                            </div>

                        </div>
                    `
                ).join("")
            }

        </div>

    `;

}


/* =========================================================
   LOAD CHANNELS
========================================================= */

async function channels(){

    const result =
        await api(
            `/api/guild/${GUILD.id}/channels`
        );

    DATA.channels =
        Array.isArray(result.channels)
            ? result.channels
            : [];

    return DATA.channels;

}


/* =========================================================
   LOAD ROLES
========================================================= */

async function roles(){

    const result =
        await api(
            `/api/guild/${GUILD.id}/roles`
        );

    DATA.roles =
        Array.isArray(result.roles)
            ? result.roles
            : [];

    return DATA.roles;

}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(page){

    document
        .querySelectorAll(".nav button")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page === page
                );

            }
        );


    const pages = {

        tickets:
            renderTickets,

        transcripts:
            renderTranscripts,

        panels:
            renderPanels,

        teams:
            renderTeams,

        blacklist:
            renderBlacklist,

        "audit-log":
            renderAudit,

        settings:
            renderSettings

    };


    const fn =
        pages[page] ||
        renderPanels;


    try{

        await fn();

    }catch(error){

        content.innerHTML = `

            <div class="card">

                <div class="empty">

                    <h3>
                        ❌ Không tải được trang
                    </h3>

                    <p>
                        ${esc(error.message)}
                    </p>

                    <button
                        class="primary"
                        type="button"
                        onclick="renderPage('${page}')"
                    >
                        🔄 Thử lại
                    </button>

                </div>

            </div>

        `;

    }

}


/* =========================================================
   PANEL
========================================================= */

async function renderPanels(){

    const result =
        await api(
            `/api/guild/${GUILD.id}/panels`
        );

    const panels =
        Array.isArray(result.panels)

/* =========================================================
   ĐÓNG MODAL
========================================================= */

function closeModal(){

    modal.classList.add(
        "hidden"
    );

    modal.innerHTML = "";

}


/* =========================================================
   CLICK RA NGOÀI MODAL
========================================================= */

modal.addEventListener(
    "click",
    event => {

        if(
            event.target === modal
        ){

            closeModal();

        }

    }
);


/* =========================================================
   EDIT PANEL
========================================================= */

async function editPanel(id){

    try{

        const result =
            await api(
                `/api/guild/${GUILD.id}/panels`
            );

        const panel =
            result.panels.find(
                item =>
                    item.id === id
            );

        if(!panel){

            throw new Error(
                "Không tìm thấy Panel."
            );

        }

        await panelModal(
            panel
        );

    }catch(error){

        toast(
            error.message
        );

    }

}


/* =========================================================
   LƯU PANEL
========================================================= */

async function savePanel(id = ""){

    const channelId =
        val("pc");

    if(!channelId){

        toast(
            "Hãy chọn kênh gửi Panel."
        );

        return;

    }


    const title =
        val("pt").trim();

    if(!title){

        toast(
            "Hãy nhập tiêu đề Panel."
        );

        return;

    }


    const body = {

        name:
            val("pn").trim() ||
            "Ticket Panel",

        channelId,

        title,

        description:
            val("pd").trim() ||
            "Nhấn nút bên dưới để mở ticket.",

        color:
            val("pco").trim() ||
            "#5865F2",

        footer:
            val("pf").trim() ||
            "Hệ thống hỗ trợ",

        buttonLabel:
            val("pbl").trim() ||
            "Mở Ticket",

        buttonEmoji:
            val("pbe").trim() ||
            "🎫",

        buttonStyle:
            val("pbs") ||
            "Primary",

        categoryId:
            val("pca"),

        supportRoleId:
            val("pr")

    };


    const saveButton =
        document.getElementById(
            "savePanelButton"
        );


    if(saveButton){

        saveButton.disabled = true;

        saveButton.textContent =
            "⏳ Đang lưu...";

    }


    try{

        await api(
            id
            ? `/api/guild/${GUILD.id}/panels/${id}`
            : `/api/guild/${GUILD.id}/panels`,
            {
                method:
                    id
                    ? "PATCH"
                    : "POST",

                body:
                    JSON.stringify(body)
            }
        );


        closeModal();

        toast(
            id
            ? "✅ Đã cập nhật Panel."
            : "✅ Đã tạo Panel và gửi vào Discord."
        );


        await renderPanels();


    }catch(error){

        toast(
            "❌ " + error.message
        );


        if(saveButton){

            saveButton.disabled =
                false;

            saveButton.textContent =
                id
                ? "💾 Lưu thay đổi"
                : "✅ Tạo Panel";

        }

    }

}

/* =========================================================

========================================================= */

async function createTeam(){

    const input =
        document.getElementById(
            "teamName"
        );

    const name =
        input?.value.trim();


    if(!name){

        toast(
            "Hãy nhập tên nhóm."
        );

        return;

    }


    try{

        await api(
            `/api/guild/${GUILD.id}/teams`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        name
                    })
            }
        );


        toast(
            "✅ Đã tạo nhóm."
        );


        await renderTeams();

    }catch(error){

        toast(
            error.message
        );

    }

}


/* =========================================================
   ADD ROLE TEAM
========================================================= */

async function addRoleToTeam(){

    const team =
        document.getElementById(
            "teamSelect"
        )?.value;

    const role =
        document.getElementById(
            "teamRole"
        )?.value;


    if(!team || !role){

        return;

    }


    try{

        await api(
            `/api/guild/${GUILD.id}/teams/${team}/roles`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        roleId:role
                    })
            }
        );


        toast(
            "✅ Đã thêm Role vào nhóm."
        );


        await renderTeams();

    }catch(error){

        toast(
            error.message
        );

    }

}

========================================================= */

async function blackUser(){

    const id =
        prompt(
            "Nhập Discord User ID:"
        );


    if(!id){

        return;

    }


    try{

        await api(
            `/api/guild/${GUILD.id}/blacklist/user`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        userId:id.trim()
                    })
            }
        );


        toast(
            "✅ Đã chặn User."
        );


        await renderBlacklist();

    }catch(error){

        toast(
            error.message
        );

    }

}


/* =========================================================
   BLACK ROLE
========================================================= */

async function blackRole(){

    if(!DATA.roles){

        await roles();

    }


    const text =
        DATA.roles
            .map(
                (role,index) =>
                    `${index + 1}. ${role.name}`
            )
            .join("\n");


    const answer =
        prompt(
            "Chọn số Role muốn chặn:\n\n" +
            text
        );


    if(!answer){

        return;

    }


    const role =
        DATA.roles[
            Number(answer) - 1
        ];


    if(!role){

        toast(
            "Role không hợp lệ."
        );

        return;

    }


    try{

        await api(
            `/api/guild/${GUILD.id}/blacklist/role`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        roleId:role.id
                    })
            }
        );


        toast(
            "✅ Đã chặn Role."
        );


        await renderBlacklist();

    }catch(error){

        toast(
            error.message
        );

    }

}

        await renderBlacklist();

    }catch(error){

        toast(
            error.message
        );

    }

}

        if(

            (

            )
        ){

            }catch{

            }

);

/* =========================================================
   BOOT
========================================================= */

async function boot(){

    /*
     * Nếu Discord callback cũ gửi:
     *
     * #auth=TOKEN
     *
     * thì lấy TOKEN và lưu lại.
     */

    const hash =
        location.hash.slice(1);


    if(
        hash.startsWith("auth=")
    ){

        const token =
            decodeURIComponent(
                hash.slice(5)
            );


        if(token){

            saveLogin(token);

        }


        history.replaceState(
            null,
            "",
            location.pathname +
            location.search
        );

    }


    /*
     * Nếu không có TOKEN:
     * hiện đăng nhập.
     */

    if(!TOKEN){

        showLogin();

        return;

    }


    /*
     * Có TOKEN:
     * kiểm tra phiên.
     */

    try{

        const me =
            await api(
                "/api/me"
            );


        ME =
            me.user;


        userName.textContent =
            ME.global_name ||
            ME.username ||
            "Discord";


        userAvatar.src =
            ME.avatarUrl ||
            "https://cdn.discordapp.com/embed/avatars/0.png";


        await loadGuilds();


        showApp();


        const current =
            route();


        if(current.guildId){

            await selectGuild(
                current.guildId,
                false
            );


            await renderPage(
                current.page
            );

        }else{

            showServers();

        }


    }catch(error){

        clearLogin();

        showLogin();

        toast(
            error.message
        );

    }

}


/* =========================================================
   CHẠY
========================================================= */

boot();
