<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Quản lý Ticket</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#0f1728;
    color:#fff;
}

body{
    overflow-x:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* =========================
   MÀU
========================= */

:root{
    --bg:#0f1728;
    --bg2:#111c2e;
    --panel:#1e2b3e;
    --panel2:#202f44;
    --input:#39485d;
    --line:#34445b;
    --blue:#2166f3;
    --blue2:#5865f2;
    --green:#168447;
    --red:#ed4245;
    --yellow:#dca900;
    --text:#fff;
    --muted:#b7c3d5;
}

/* =========================
   ĐĂNG NHẬP
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
        radial-gradient(
            circle at 50% 20%,
            #243b69 0%,
            #121d31 35%,
            #080d17 100%
        );
}

.login-box{
    width:430px;
    max-width:100%;
    padding:42px;

    background:#181f2c;
    border:1px solid #3c4a5e;
    border-radius:16px;

    text-align:center;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);
}

.login-logo{
    width:90px;
    height:90px;

    margin:auto;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#5865f2;

    font-size:42px;
    font-weight:900;
}

.login-box h1{
    margin:25px 0 10px;
    font-size:30px;
}

.login-box p{
    color:#b7c3d5;
    line-height:1.7;
}

.login-button{
    width:100%;
    margin-top:20px;

    background:#5865f2;
    color:#fff;

    padding:13px 18px;

    border-radius:7px;

    font-weight:bold;

    transition:.15s;
}

.login-button:hover{
    background:#4752c4;
    transform:translateY(-1px);
}

.login-error{
    margin-top:15px;
    padding:12px;

    border-radius:7px;

    background:#442126;
    border:1px solid #79313a;

    color:#ff9a9f;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;

    width:80px;

    background:#1b293c;

    border-right:1px solid #2c3b50;

    z-index:100;
}

.sidebar-logo{
    height:82px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    border-bottom:1px solid #2d3c50;
}

.sidebar-nav{
    padding-top:8px;
}

.nav-button{
    position:relative;

    width:100%;
    height:64px;

    background:transparent;

    color:#fff;

    font-size:21px;

    border-left:3px solid transparent;

    transition:.15s;
}

.nav-button:hover{
    background:#26364b;
}

.nav-button.active{
    background:#2b3d54;
    border-left-color:#2775ff;
}

/* TOOLTIP */

.nav-button::after{
    content:attr(data-tooltip);

    position:absolute;

    left:72px;
    top:50%;

    transform:
        translateY(-50%)
        translateX(-5px);

    opacity:0;
    pointer-events:none;

    white-space:nowrap;

    background:#111827;
    color:#fff;

    border:1px solid #46566c;

    padding:8px 11px;

    border-radius:6px;

    font-size:14px;

    box-shadow:0 8px 25px rgba(0,0,0,.4);

    transition:.15s;

    z-index:999;
}

.nav-button:hover::after{
    opacity:1;
    transform:
        translateY(-50%)
        translateX(0);
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:80px;

    width:calc(100% - 80px);

    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    background:#111c2e;

    border-bottom:1px solid #27364b;

    z-index:50;
}

.server-select{
    min-width:280px;

    background:#39485d;

    color:#fff;

    border:1px solid #526179;

    border-radius:6px;

    padding:10px 13px;

    outline:none;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-name{
    font-weight:bold;
}

.avatar{
    width:38px;
    height:38px;

    border-radius:50%;

    object-fit:cover;

    background:#5865f2;
}

.logout-button{
    margin-left:10px;

    padding:9px 12px;

    border-radius:6px;

    background:#3b4658;

    color:#fff;
}

.logout-button:hover{
    background:#4b586c;
}

/* =========================
   CONTENT
========================= */

.content{
    width:min(1160px,calc(100% - 40px));

    margin:auto;

    padding:34px 0 70px;
}

.page-title{
    margin:5px 0 7px;

    text-align:center;

    font-size:30px;
}

.page-subtitle{
    margin:0 0 30px;

    text-align:center;

    color:var(--muted);
}

/* =========================
   CARD
========================= */

.card{
    margin:20px 0;

    background:var(--panel);

    border:1px solid #26364b;

    border-radius:12px;

    overflow:hidden;
}

.card-header{
    min-height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:16px;

    border-bottom:1px solid var(--line);
}

.card-header h2{
    margin:0;

    font-size:20px;
}

.card-body{
    padding:20px;
}

/* =========================
   BUTTONS
========================= */

.btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:10px 16px;

    border-radius:6px;

    color:#fff;

    font-weight:bold;

    transition:.15s;
}

.btn-blue{
    background:#2166f3;
}

.btn-blue:hover{
    background:#1856d1;
}

.btn-green{
    background:#168447;
}

.btn-green:hover{
    background:#116b38;
}

.btn-red{
    background:#ed4245;
}

.btn-red:hover{
    background:#c83235;
}

.btn-gray{
    background:#46546a;
}

.btn-gray:hover{
    background:#526279;
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================
   INPUT
========================= */

.input,
.select,
.textarea{
    width:100%;

    background:var(--input);

    color:#fff;

    border:1px solid #536176;

    border-radius:5px;

    padding:11px 13px;

    outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:#6d91ff;
}

.textarea{
    min-height:170px;
    resize:vertical;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;

    margin-bottom:8px;

    font-weight:bold;
}

.help{
    margin-top:5px;

    color:#9eabc0;

    font-size:13px;
}

/* =========================
   GRID
========================= */

.grid-2{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;
}

.grid-3{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:16px;
}

.grid-4{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:16px;
}

/* =========================
   FILTER
========================= */

.filter-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    width:100%;

    overflow-x:auto;
}

.table{
    width:100%;

    border-collapse:collapse;
}

.table th{
    background:#39485d;

    color:#fff;

    padding:14px 12px;

    text-align:left;

    font-size:13px;

    text-transform:uppercase;

    white-space:nowrap;
}

.table td{
    padding:15px 12px;

    border-bottom:1px solid #34445a;

    white-space:nowrap;
}

.table tr:hover td{
    background:#243349;
}

/* =========================
   BADGE
========================= */

.badge{
    display:inline-block;

    padding:5px 9px;

    border-radius:5px;

    background:#28579c;

    color:#fff;

    font-size:12px;
}

.badge-green{
    background:#168447;
}

.badge-red{
    background:#8c3034;
}

.badge-yellow{
    background:#806300;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:60px 20px;

    text-align:center;

    color:#9caac0;
}

.empty-icon{
    font-size:45px;

    margin-bottom:10px;
}

/* =========================
   SERVER
========================= */

.server-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}

.server-card{
    padding:22px;

    background:#141e2d;

    border:1px solid #27364b;

    border-radius:12px;
}

.server-top{
    display:flex;

    align-items:center;

    gap:14px;
}

.server-icon{
    width:58px;
    height:58px;

    border-radius:14px;

    object-fit:cover;
}

.server-name{
    font-size:18px;

    font-weight:bold;
}

.server-status{
    margin-top:7px;

    color:#9eabc0;
}

/* =========================
   PANEL ROW
========================= */

.panel-row{
    display:grid;

    grid-template-columns:
        1.1fr
        1.3fr
        .7fr
        .8fr
        80px;

    gap:10px;

    align-items:center;

    padding:15px 10px;

    border-bottom:1px solid #34445a;
}

.panel-row.header{
    color:#b7c3d5;

    font-size:12px;

    text-transform:uppercase;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.72);

    z-index:500;
}

.modal-box{
    width:min(760px,95vw);

    max-height:92vh;

    overflow-y:auto;

    background:#1b2739;

    border:1px solid #46566c;

    border-radius:11px;

    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.modal-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:18px;

    border-bottom:1px solid #3a4a60;
}

.modal-header h2{
    margin:0;
}

.modal-close{
    background:transparent;

    color:#fff;

    font-size:24px;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    padding:16px 20px;

    border-top:1px solid #3a4a60;
}

/* =========================
   PANEL PREVIEW
========================= */

.preview{
    background:#2b2d31;

    border-left:4px solid #5865f2;

    padding:18px;

    border-radius:5px;
}

.preview-title{
    font-size:18px;

    font-weight:bold;

    margin-bottom:10px;
}

.preview-description{
    color:#e1e5ea;

    line-height:1.5;
}

.preview-footer{
    margin-top:18px;

    padding-top:12px;

    border-top:1px solid #45484e;

    color:#9da4ad;

    font-size:13px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;

    right:22px;
    bottom:22px;

    max-width:420px;

    padding:14px 18px;

    background:#202d40;

    border:1px solid #52647d;

    border-radius:8px;

    box-shadow:0 15px 40px rgba(0,0,0,.4);

    z-index:1000;
}

/* =========================
   SETUP
========================= */

.setup-item{
    display:flex;

    align-items:center;

    gap:9px;

    margin:12px 0;

    font-size:16px;
}

.setup-check{
    width:22px;
    height:22px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    border-radius:4px;

    background:#3ba55d;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .server-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .grid-3,
    .grid-4{
        grid-template-columns:repeat(2,1fr);
    }

    .filter-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:750px){

    .sidebar{
        width:60px;
    }

    .main{
        margin-left:60px;

        width:calc(100% - 60px);
    }

    .nav-button::after{
        left:54px;
    }

    .content{
        width:calc(100% - 24px);

        padding-top:20px;
    }

    .topbar{
        padding:0 12px;
    }

    .server-select{
        min-width:160px;
    }

    .user-name{
        display:none;
    }

    .grid-2,
    .grid-3,
    .grid-4,
    .filter-grid,
    .server-grid{
        grid-template-columns:1fr;
    }

    .panel-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            🎫
        </div>

        <h1>Quản Lý Ticket</h1>

        <p>
            Đăng nhập bằng Discord để quản lý
            server, ticket, transcript và panel.
        </p>

        <button
            class="login-button"
            onclick="loginDiscord()"
        >
            🎮 Đăng nhập bằng Discord
        </button>

        <div
            id="loginError"
            class="login-error hidden"
        ></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

    <aside class="sidebar">

        <div class="sidebar-logo">
            🎫
        </div>

        <div class="sidebar-nav">

            <button
                class="nav-button"
                data-page="tickets"
                data-tooltip="Ticket đang mở"
            >
                🎟️
            </button>

            <button
                class="nav-button"
                data-page="transcripts"
                data-tooltip="Transcript"
            >
                🧾
            </button>

            <button
                class="nav-button"
                data-page="panels"
                data-tooltip="Quản lý Panel"
            >
                ▣
            </button>

            <button
                class="nav-button"
                data-page="teams"
                data-tooltip="Đội hỗ trợ"
            >
                👥
            </button>

            <button
                class="nav-button"
                data-page="blacklist"
                data-tooltip="Danh sách chặn"
            >
                ⛔
            </button>

            <button
                class="nav-button"
                data-page="audit-log"
                data-tooltip="Nhật ký hoạt động"
            >
                ↶
            </button>

            <button
                class="nav-button"
                data-page="settings"
                data-tooltip="Cài đặt & Setup"
            >
                ⚙️
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <select
                id="serverSelect"
                class="server-select"
            ></select>

            <div class="user-area">

                <img
                    id="userAvatar"
                    class="avatar"
                    alt="avatar"
                >

                <span
                    id="userName"
                    class="user-name"
                ></span>

                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    Đăng xuất
                </button>

            </div>

        </header>


        <section
            id="content"
            class="content"
        ></section>

    </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
    id="modal"
    class="modal hidden"
></div>


<!-- =========================
     TOAST
========================= -->

<div
    id="toast"
    class="hidden"
></div>


<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const API =
    "https://imcongthienzz.freesrv.com";

/*
 * TOKEN chỉ được frontend lưu sau khi backend
 * hoàn thành OAuth2.
 *
 * Frontend KHÔNG tự tạo redirect_uri.
 */

const TOKEN_KEY =
    "dashboard_token";

let TOKEN =
    localStorage.getItem(TOKEN_KEY) || "";

let ME = null;

let GUILDS = [];

let GUILD = null;

let DATA = {
    channels:[],
    roles:[],
    teams:[]
};


/* =========================================================
   HELPER
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(m){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            }[m];

        });

}


function val(id){

    const el =
        document.getElementById(id);

    return el ? el.value : "";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent =
        message;

    el.classList.remove("hidden");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(function(){

            el.classList.add("hidden");

        },3500);

}


/* =========================================================
   API
========================================================= */

async function api(path,options={}){

    const headers = {
        ...(options.headers || {}),
        "Content-Type":"application/json"
    };

    if(TOKEN){

        headers.Authorization =
            "Bearer " + TOKEN;

    }

    const response =
        await fetch(
            API + path,
            {
                ...options,
                headers
            }
        );

    let data = {};

    try{

        data =
            await response.json();

    }catch{

        data = {};

    }

    if(!response.ok){

        if(response.status === 401){

            clearLogin();

        }

        throw new Error(
            data.error ||
            "Có lỗi xảy ra khi kết nối máy chủ."
        );

    }

    return data;

}


/* =========================================================
   OAUTH2
========================================================= */

function loginDiscord(){

    /*
     * QUAN TRỌNG:
     *
     * Không tạo URL OAuth Discord ở frontend.
     *
     * Backend tự tạo:
     *
     * /auth/discord
     *
     * Backend hiện tại đã có endpoint này.
     */

    window.location.assign(
        API + "/auth/discord"
    );

}


/* =========================================================
   XỬ LÝ CALLBACK
========================================================= */

function processOAuthCallback(){

    const hash =
        window.location.hash.substring(1);

    if(!hash){

        return false;

    }

    const params =
        new URLSearchParams(hash);

    const auth =
        params.get("auth");

    const error =
        params.get("error");

    if(auth){

        TOKEN =
            auth;

        localStorage.setItem(
            TOKEN_KEY,
            TOKEN
        );

        /*
         * Xóa token khỏi URL.
         */

        history.replaceState(
            null,
            document.title,
            window.location.pathname
        );

        return true;

    }

    if(error){

        const box =
            document.getElementById(
                "loginError"
            );

        box.textContent =
            "Đăng nhập thất bại: " +
            error;

        box.classList.remove(
            "hidden"
        );

        history.replaceState(
            null,
            document.title,
            window.location.pathname
        );

    }

    return false;

}


/* =========================================================
   XÓA ĐĂNG NHẬP
========================================================= */

function clearLogin(){

    TOKEN = "";

    ME = null;

    GUILDS = [];

    GUILD = null;

    localStorage.removeItem(
        TOKEN_KEY
    );

    showLogin();

}


async function logout(){

    try{

        await fetch(
            API + "/auth/logout",
            {
                method:"GET"
            }
        );

    }catch{

    }

    clearLogin();

}


/* =========================================================
   HIỂN THỊ
========================================================= */

function showLogin(){

    document
        .getElementById("loginPage")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");

}


function showApp(){

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

}


/* =========================================================
   ROUTE
========================================================= */

function route(){

    const hash =
        window.location.hash.substring(1);

    const parts =
        hash.split("/");

    if(parts[0] === "manage"){

        return {
            guildId:parts[1],
            page:parts[2] || "panels"
        };

    }

    return {
        guildId:null,
        page:"servers"
    };

}


function go(page){

    if(!GUILD){

        return;

    }

    window.location.hash =
        "manage/" +
        GUILD.id +
        "/" +
        page;

}


/* =========================================================
   SERVER SELECT
========================================================= */

function renderServerSelect(){

    const select =
        document.getElementById(
            "serverSelect"
        );

    select.innerHTML =
        GUILDS.map(function(g){

            return `
                <option value="${esc(g.id)}">
                    ${esc(g.name)}
                </option>
            `;

        }).join("");

    select.onchange =
        function(){

            selectGuild(
                this.value,
                true
            );

        };

}


/* =========================================================
   SERVER LIST
========================================================= */

function renderServers(){

    showApp();

    document.getElementById(
        "content"
    ).innerHTML = `

        <h1 class="page-title">
            Server của bạn
        </h1>

        <p class="page-subtitle">
            Chọn server để quản lý hệ thống Ticket

/* =========================================================
   CHỌN SERVER
========================================================= */

async function selectGuild(id,redirect=true){

    const selected =
        GUILDS.find(
            g => g.id === id
        );

    if(!selected){

        renderServers();

        return;

    }

    if(!selected.botInstalled){

        toast(
            "Bot chưa được thêm vào server này."
        );

        return;

    }

    try{

        const result =
            await api(
                "/api/guild/" +
                id
            );

        GUILD = {
            ...selected,
            ...(result.guild || {})
        };

        showApp();

        document
            .getElementById(
                "serverSelect"
            )
            .value = id;

        if(redirect){

            go("panels");

        }

    }catch(error){

        toast(error.message);

    }

}

/* =========================================================
   PAGE
========================================================= */

async function renderPage(page){

    document
        .querySelectorAll(".nav-button")
        .forEach(function(button){

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });

    if(page === "tickets"){

        await renderTickets();

        return;

    }

    if(page === "transcripts"){

        await renderTranscripts();

        return;

    }

    if(page === "panels"){

        await renderPanels();

        return;

    }

    if(page === "teams"){

        await renderTeams();

        return;

    }

    if(page === "blacklist"){

        await renderBlacklist();

        return;

    }

    if(page === "audit-log"){

        await renderAudit();

        return;

    }

    if(page === "settings"){

        await renderSettings();

        return;

    }

    await renderPanels();

}

function updatePanelPreview(){

    const title =
        val("panelTitle");

    const description =
        val("panelDescription");

    const footer =
        val("panelFooter");

    const button =
        val("panelButton");

    const emoji =
        val("panelEmoji");

    const titleEl =
        document.getElementById(
            "previewTitle"
        );

    const descEl =
        document.getElementById(
            "previewDescription"
        );

    const footerEl =
        document.getElementById(
            "previewFooter"
        );

    if(titleEl){

        titleEl.textContent =
            title;

    }

    if(descEl){

        descEl.textContent =
            description;

    }

    if(footerEl){

        footerEl.textContent =
            footer;

    }

    const previewButton =
        document.querySelector(
            "#panelPreview button"
        );

    if(previewButton){

        previewButton.textContent =
            emoji + " " + button;

    }

}


async function editPanel(id){

    const data =
        await api(
            "/api/guild/" +
            GUILD.id +
            "/panels"
        );

    const panel =
        (data.panels || [])
            .find(
                p => p.id === id
            );

    if(!panel){

        toast(
            "Không tìm thấy Panel."
        );

        return;

    }

    createPanelModal(
        panel
    );

}


async function savePanel(id){

    const channelId =
        val("panelChannel");

    const name =
        val("panelName").trim();

    if(!name){

        toast(
            "Vui lòng nhập tên Panel."
        );

        return;

    }

    if(!channelId){

        toast(
            "Vui lòng chọn kênh gửi Panel."
        );

        return;

    }

    const payload = {

        name,

        channelId,

        title:
            val("panelTitle"),

        description:
            val("panelDescription"),

        color:
            val("panelColor"),

        footer:
            val("panelFooter"),

        buttonLabel:
            val("panelButton"),

        buttonEmoji:
            val("panelEmoji"),

        categoryId:
            val("panelCategory"),

        supportRoleId:
            val("panelRole")

    };

    try{

        await api(
            "/api/guild/" +
            GUILD.id +
            "/panels" +
            (
                id
                ?
                "/" + id
                :
                ""
            ),
            {
                method:
                    id
                    ?
                    "PATCH"
                    :
                    "POST",

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

        closeModal();

        toast(
            id

            "Đã tạo Panel và gửi vào Discord."

        toast(
            error.message

}

async function createTeam(){

    const name =
        val("teamName").trim();

    if(!name){

        toast(
            "Vui lòng nhập tên đội."
        );

        return;

    }

    try{

        await api(
            "/api/guild/" +
            GUILD.id +
            "/teams",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        toast(
            "Đã tạo đội hỗ trợ."
        );

        renderTeams();

    }catch(error){

        toast(
            error.message
        );

    }

}


async function addTeamRole(){

    const teamId =
        val("teamSelect");

    const roleId =
        val("teamRole");

    if(!teamId || !roleId){

        return;

    }

    try{

        await api(
            "/api/guild/" +
            GUILD.id +
            "/teams/" +
            teamId +
            "/roles",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        roleId
                    })
            }
        );

        toast(
            "Đã thêm Role vào đội."

        renderTeams();

    }catch(error){

        toast(
            error.message
        );

    }

}

async function blacklistUser(){

    const id =
        prompt(
            "Nhập User ID cần chặn:"
        );

    if(!id){

        return;

    }

    try{

        await api(
            "/api/guild/" +
            GUILD.id +
            "/blacklist/user",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        userId:id.trim()
                    })
            }
        );

        toast(
            "Đã chặn người dùng."
        );

        renderBlacklist();

    }catch(error){

        toast(
            error.message
        );

    }

}


async function blacklistRole(){

    await loadRoles();

    if(!DATA.roles.length){

        toast(
            "Server chưa có Role."
        );

        return;

    }

    const list =
        DATA.roles
            .map(
                (r,i) =>
                    i +
                    " - " +
                    r.name
            )
            .join("\n");

    const number =
        prompt(
            "Nhập số Role cần chặn:\n\n" +
            list
        );

    if(number === null){

        return;

    }

    const role =
        DATA.roles[
            Number(number)
        ];

    if(!role){

        toast(
            "Role không hợp lệ."
        );

        return;

    }

    try{

        await api(
            "/api/guild/" +
            GUILD.id +
            "/blacklist/role",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        roleId:role.id
                    })
            }
        );

        toast(
            "Đã chặn Role."
        );

        renderBlacklist();

    }catch(error){

        toast(
            error.message
        );

    }

}


async function removeBlacklist(type,id){

    try{

        await api(
            "/api/guild/" +
            GUILD.id +
            "/blacklist/" +
            type +
            "/" +
            id,
            {
                method:"DELETE"
            }
        );

        toast(
            "Đã bỏ chặn."
        );

        renderBlacklist();

    }catch(error){

        toast(
            error.message
        );

    }

}

    try{

        await api(
            "/api/guild/" +
            GUILD.id +

            {
                method:"POST"
            }

            await api(
                "/api/guild/" +
                GUILD.id
            );

        GUILD = {
            ...GUILD,

        renderSettings();

    }catch(error){

window.addEventListener(
    "hashchange",
    async function(){

        const r =
            route();

        if(!r.guildId){

            renderServers();

            return;

        }

        if(
            !GUILD ||
            GUILD.id !== r.guildId
        ){

            await selectGuild(
                r.guildId,
                false
            );

        }

        if(GUILD){

            await renderPage(
                r.page
            );

        }

    }
);


/* =========================================================
   BOOT
========================================================= */

async function boot(){

    /*
     * Bước 1:
     * Nhận OAuth callback nếu có.
     */

    processOAuthCallback();


    /*
     * Bước 2:
     * Nếu chưa có token -> đăng nhập.
     */

    if(!TOKEN){

        showLogin();

        return;

    }


    /*
     * Bước 3:
     * Kiểm tra token.
     */

    try{

        const me =
            await api(
                "/api/me"
            );

        ME =
            me.user;


        /*
         * Hiển thị user.
         */

        document
            .getElementById(
                "userName"
            )
            .textContent =
                ME.global_name ||
                ME.username ||
                "Discord";


        document
            .getElementById(
                "userAvatar"
            )
            .src =
                ME.avatarUrl ||
                (
                    ME.avatar
                    ?
                    "https://cdn.discordapp.com/avatars/" +
                    ME.id +
                    "/" +
                    ME.avatar +
                    ".png?size=128"
                    :
                    "https://cdn.discordapp.com/embed/avatars/0.png"
                );


        /*
         * Lấy server.
         */

        const guildResult =
            await api(
                "/api/guilds"
            );

        GUILDS =
            guildResult.guilds ||
            [];


        renderServerSelect();


        /*
         * Hiển thị app.
         */

        showApp();


        /*
         * Kiểm tra route.
         */

        const r =
            route();

        if(r.guildId){

            await selectGuild(
                r.guildId,
                false
            );

            if(GUILD){

                await renderPage(
                    r.page
                );

            }

        }else{

            renderServers();

        }

    }catch(error){

        console.error(
            error
        );

        clearLogin();

        const box =
            document.getElementById(
                "loginError"
            );

        box.textContent =
            error.message ||
            "Phiên đăng nhập đã hết hạn.";

        box.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   CLICK NGOÀI MODAL
========================================================= */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){

                closeModal();

            }

        }
    );


/* =========================================================
   START
========================================================= */

boot();
