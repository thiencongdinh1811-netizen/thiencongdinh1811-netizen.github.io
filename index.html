<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bot Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #151b3d 0%, transparent 40%),
                radial-gradient(circle at bottom right, #101b38 0%, transparent 40%),
                #080b12;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .center {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 430px;
            max-width: 100%;
            padding: 40px;
            background: rgba(25, 28, 38, 0.95);
            border: 1px solid #303544;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            color: #aeb4c2;
            line-height: 1.6;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 9px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        .loading {
            color: #aeb4c2;
        }

        .dashboard {
            display: none;
            min-height: 100vh;
        }

        .topbar {
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111522;
            border-bottom: 1px solid #292e3d;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .content {
            max-width: 1100px;
            margin: auto;
            padding: 40px 25px;
        }

        .welcome {
            background: #151927;
            border: 1px solid #2b3040;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .guild-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }

        .guild {
            background: #151927;
            border: 1px solid #2b3040;
            border-radius: 14px;
            padding: 22px;
        }

        .guild-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .guild-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status {
            color: #55d17a;
            font-size: 14px;
        }

        .logout {
            width: auto;
            margin: 0;
            padding: 9px 15px;
            background: #ed4245;
            font-size: 14px;
        }

        .logout:hover {
            background: #c93639;
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="center">

    <div class="login-box">

        <div class="logo">
            B
        </div>

        <h1>Bot Manager</h1>

        <p>
            Đăng nhập bằng Discord để quản lý bot
            và cấu hình các server mà bot đang tham gia.
        </p>

        <button onclick="loginDiscord()">
            🎮 Đăng nhập bằng Discord
        </button>

        <div id="error" class="error"></div>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="dashboard">

    <div class="topbar">

        <div class="brand">
            🤖 Bot Manager
        </div>

        <div class="user">

            <div id="username">
                Đang tải...
            </div>

            <div id="avatar" class="avatar">
                U
            </div>

            <button
                class="logout"
                onclick="logout()">
                Đăng xuất
            </button>

        </div>

    </div>


    <div class="content">

        <div class="welcome">

            <h2>
                Xin chào, <span id="welcomeName">User</span> 👋
            </h2>

            <p>
                Đây là trang quản lý bot Discord của mày.
            </p>

        </div>


        <h2>
            Server của bạn
        </h2>

        <div id="guilds"
             class="guild-grid">

            <p class="loading">
                Đang tải danh sách server...
            </p>

        </div>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://imcongthienzz.freesrv.com";


// =====================================================
// ĐĂNG NHẬP DISCORD
// =====================================================

function loginDiscord() {

    window.location.href =
        BACKEND_URL + "/auth/discord";

}


// =====================================================
// KIỂM TRA ĐĂNG NHẬP
// =====================================================

async function checkLogin() {

    try {

        const response =
            await fetch(
                BACKEND_URL + "/api/me",
                {
                    method: "GET",

                    credentials: "include",

                    cache: "no-store"
                }
            );


        if (!response.ok) {

            showLogin();

            return;
        }


        const data =
            await response.json();


        if (!data.loggedIn) {

            showLogin();

            return;
        }


        console.log(
            "✅ Đã đăng nhập:",
            data.user
        );


        showDashboard(
            data.user
        );


        loadGuilds();


    } catch (error) {

        console.error(
            "❌ Không kiểm tra được đăng nhập:",
            error
        );

        showLogin();

    }

}


// =====================================================
// HIỆN LOGIN
// =====================================================

function showLogin() {

    document.getElementById(
        "loginPage"
    ).style.display = "flex";


    document.getElementById(
        "dashboard"
    ).style.display = "none";

}


// =====================================================
// HIỆN DASHBOARD
// =====================================================

function showDashboard(user) {

    document.getElementById(
        "loginPage"
    ).style.display = "none";


    document.getElementById(
        "dashboard"
    ).style.display = "block";


    const name =
        user.global_name ||
        user.username ||
        "User";


    document.getElementById(
        "username"
    ).textContent = name;


    document.getElementById(
        "welcomeName"
    ).textContent = name;


    const avatar =
        document.getElementById("avatar");


    if (user.avatar) {

        avatar.style.backgroundImage =
            `url(https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128)`;

        avatar.style.backgroundSize =
            "cover";

        avatar.textContent = "";

    } else {

        avatar.textContent =
            name.charAt(0).toUpperCase();

    }

}


// =====================================================
// LOAD SERVER
// =====================================================

async function loadGuilds() {

    const container =
        document.getElementById("guilds");


    try {

        const response =
            await fetch(
                BACKEND_URL + "/api/guilds",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Không lấy được server"
            );

        }


        const data =
            await response.json();


        container.innerHTML = "";


        if (
            !data.guilds ||
            data.guilds.length === 0
        ) {

            container.innerHTML = `
                <p>
                    Không tìm thấy server nào
                    mà bạn có quyền quản lý.
                </p>
            `;

            return;
        }


        data.guilds.forEach(guild => {

            const card =
                document.createElement("div");


            card.className =
                "guild";


            card.innerHTML = `

                <div class="guild-icon">

                    ${
                        guild.icon
                        ? `<img
                            src="${guild.icon}"
                            style="
                                width:55px;
                                height:55px;
                                border-radius:15px;
                            "
                        >`
                        : "🏠"
                    }

                </div>


                <div class="guild-name">

                    ${escapeHtml(guild.name)}

                </div>


                <div class="status">

                    ${
                        guild.botInstalled
                        ? "🟢 Bot đang ở server"
                        : "⚪ Bot chưa vào server"
                    }

                </div>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(error);


        container.innerHTML = `
            <p class="error">
                ❌ Không thể tải danh sách server.
            </p>
        `;

    }

}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    window.location.href =
        BACKEND_URL + "/auth/logout";

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


// =====================================================
// XỬ LÝ URL SAU OAUTH
// =====================================================

function cleanOAuthUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    if (
        params.get("login") ===
        "success"
    ) {

        console.log(
            "✅ OAuth login thành công"
        );

        // Xóa ?login=success
        // khỏi thanh địa chỉ

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

    }


    const error =
        params.get("error");


    if (error) {

        document.getElementById(
            "error"
        ).textContent =
            "❌ Đăng nhập Discord thất bại: " +
            error;

    }

}


// =====================================================
// START
// =====================================================

cleanOAuthUrl();

checkLogin();

</script>

</body>
</html>
