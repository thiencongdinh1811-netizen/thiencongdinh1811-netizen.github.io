<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Tickets | Bảng điều khiển</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#101a2b;
    --side:#1c293b;
    --card:#1f2d41;
    --card2:#24344a;
    --input:#3a485d;
    --line:#35445a;
    --blue:#2166f3;
    --green:#19a463;
    --red:#e53935;
    --text:#f4f7fb;
    --muted:#b7c4d7;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* =====================================================
   LOGIN
===================================================== */

#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 15%,
            #1d3155,
            #080d17 65%
        );
}

.loginbox{
    width:430px;
    padding:42px;

    background:#181f2b;

    border:
        1px solid #394456;

    border-radius:16px;

    text-align:center;

    box-shadow:
        0 25px 80px #0009;
}

.logo{
    width:82px;
    height:82px;

    margin:auto;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:#5865f2;

    font-size:38px;
    font-weight:900;
}

.loginbox h1{
    margin:22px 0 10px;
}

.loginbox p{
    color:#abb8cc;
    line-height:1.7;
}

/* =====================================================
   LAYOUT
===================================================== */

.app{
    min-height:100vh;
}

.side{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:80px;

    background:var(--side);

    border-right:
        1px solid #2d3b4f;

    z-index:50;
}

.brand{
    height:82px;

    display:grid;
    place-items:center;

    font-size:25px;

    border-bottom:
        1px solid #2d3b4f;
}

.nav button{
    position:relative;

    width:100%;
    height:64px;

    background:transparent;

    color:white;

    font-size:21px;

    border-left:
        3px solid transparent;

    transition:.15s;
}

.nav button:hover,
.nav button.active{
    background:#26364c;

    border-left-color:
        #2775ff;
}

/* TOOLTIP */

.nav button::after{
    content:attr(data-tip);

    position:absolute;

    left:72px;
    top:50%;

    transform:
        translateY(-50%)
        translateX(-5px);

    padding:
        8px 12px;

    background:#111827;

    color:white;

    font-size:13px;

    border-radius:6px;

    white-space:nowrap;

    opacity:0;

    pointer-events:none;

    transition:.15s;

    box-shadow:
        0 5px 20px #0008;

    z-index:100;
}

.nav button:hover::after{
    opacity:1;

    transform:
        translateY(-50%)
        translateX(0);
}

.main{
    margin-left:80px;

    min-height:100vh;
}

.top{
    height:70px;

    background:#111c2e;

    border-bottom:
        1px solid #27364b;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 28px;

    position:sticky;

    top:0;

    z-index:20;
}

.server-select{
    background:#35445a;

    color:white;

    border:
        1px solid #506078;

    border-radius:5px;

    padding:
        10px 13px;

    min-width:300px;
}

.user{
    display:flex;

    align-items:center;

    gap:10px;
}

.avatar{
    width:38px;
    height:38px;

    border-radius:50%;

    object-fit:cover;

    background:#5865f2;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    max-width:1220px;

    margin:auto;

    padding:
        34px 30px 80px;
}

.title{
    text-align:center;

    margin:
        8px 0 7px;

    font-size:30px;
}

.subtitle{
    text-align:center;

    color:var(--muted);

    margin-bottom:34px;
}

.card{
    background:var(--card);

    border:
        1px solid #293a51;

    border-radius:12px;

    margin:
        22px 0;

    overflow:hidden;
}

.cardhead{
    padding:
        18px 16px;

    border-bottom:
        1px solid var(--line);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;
}

.cardhead h2{
    margin:0;

    font-size:20px;
}

.body{
    padding:20px;
}

.grid2{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;
}

.grid3{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

.filtergrid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;

    margin-bottom:8px;

    color:#eef3fb;
}

.input,
.select,
.textarea{
    width:100%;

    background:var(--input);

    color:white;

    border:
        1px solid #536179;

    border-radius:5px;

    padding:
        11px 13px;

    outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:#638cff;
}

.textarea{
    min-height:170px;

    resize:vertical;
}

.actions{
    display:flex;

    gap:9px;

    flex-wrap:wrap;
}

.primary,
.secondary,
.success,
.danger{
    padding:
        10px 16px;

    border-radius:6px;

    color:white;

    font-weight:700;
}

.primary{
    background:var(--blue);
}

.secondary{
    background:#536176;
}

.success{
    background:var(--green);
}

.danger{
    background:var(--red);
}

.primary:hover,
.secondary:hover,
.success:hover,
.danger:hover{
    filter:brightness(1.1);
}

.badge{
    display:inline-block;

    padding:
        4px 9px;

    border-radius:5px;

    background:#285493;

    color:#eaf2ff;

    font-size:12px;

    font-weight:700;
}

.muted{
    color:var(--muted);
}

.empty{
    padding:
        55px 20px;

    text-align:center;

    color:var(--muted);
}

.empty h3{
    color:white;
}

/* =====================================================
   TABLE
===================================================== */

.tablewrap{
    overflow:auto;
}

.table{
    width:100%;

    border-collapse:collapse;
}

.table th{
    background:#3c4b61;

    color:white;

    text-align:left;

    padding:
        14px 15px;

    font-size:13px;

    text-transform:uppercase;
}

.table td{
    padding:
        16px 15px;

    border-bottom:
        1px solid #334359;
}

.table tr:hover td{
    background:#24354a;
}

/* =====================================================
   PANEL ROW
===================================================== */

.panelrow{
    display:grid;

    grid-template-columns:
        1.2fr 1fr .7fr .8fr auto;

    gap:10px;

    align-items:center;

    padding:
        14px 8px;

    border-bottom:
        1px solid #344359;
}

.panelrow.head{
    color:#b8c5d7;

    font-size:12px;

    text-transform:uppercase;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    background:#0009;

    display:grid;

    place-items:center;

    z-index:200;
}

.modalbox{
    width:
        min(1000px,94vw);

    max-height:92vh;

    overflow:auto;

    background:#1b2739;

    border:
        1px solid #46566e;

    border-radius:10px;
}

.modalhead{
    padding:18px;

    border-bottom:
        1px solid #3b4a60;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.modalhead h2{
    margin:0;
}

.modalbody{
    padding:22px;
}

.closex{
    background:transparent;

    color:white;

    font-size:24px;
}

/* =====================================================
   PANEL PREVIEW
===================================================== */

.preview{
    background:#292929;

    border-radius:5px;

    padding:16px;

    min-height:130px;
}

.preview h3{
    margin:
        0 0 12px;
}

.preview button{
    background:#5865f2;

    color:white;

    border-radius:5px;

    padding:
        9px 14px;

    font-weight:700;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    right:22px;

    bottom:22px;

    background:#222e42;

    border:
        1px solid #53637a;

    padding:
        13px 18px;

    border-radius:7px;

    z-index:500;

    box-shadow:
        0 10px 30px #0008;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .side{
        width:60px;
    }

    .main{
        margin-left:60px;
    }

    .grid2,
    .grid3,
    .filtergrid{
        grid-template-columns:1fr;
    }

    .panelrow{
        grid-template-columns:1fr;
    }

    .top{
        padding:
            0 12px;
    }

    .server-select{
        min-width:170px;
    }

    .content{
        padding:
            20px 12px 60px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="loginbox">

        <div class="logo">
            🎫
        </div>

        <h1>
            Hệ Thống Ticket
        </h1>

        <p>
            Đăng nhập bằng Discord để quản lý
            server, Panel, Ticket và hệ thống hỗ trợ.
        </p>

        <button
            class="primary loginbtn"
            style="width:100%;margin-top:15px"
            onclick="login()"
        >
            🎮 Đăng nhập bằng Discord
        </button>

    </div>

</div>

<!-- =====================================================
     APP
===================================================== -->

<div
    id="app"
    class="app hidden"
>

<aside class="side">

    <div class="brand">
        🎫
    </div>

    <div class="nav">

        <button
            data-page="tickets"
            data-tip="Ticket đang mở"
        >
            🎟️
        </button>

        <button
            data-page="transcripts"
            data-tip="Transcript"
        >
            🧾
        </button>

        <button
            data-page="panels"
            data-tip="Panels"
        >
            ▣
        </button>

        <button
            data-page="teams"
            data-tip="Nhóm hỗ trợ"
        >
            👥
        </button>

        <button
            data-page="blacklist"
            data-tip="Danh sách đen"
        >
            ⊘
        </button>

        <button
            data-page="audit-log"
            data-tip="Nhật ký hoạt động"
        >
            ↶
        </button>

        <button
            data-page="settings"
            data-tip="Cài đặt"
        >
            ⚙
        </button>

    </div>

</aside>

<main class="main">

<header class="top">

    <select
        id="serverSelect"
        class="server-select"
    ></select>

    <div class="user">

        <img
            id="userAvatar"
            class="avatar"
        >

        <span id="userName"></span>

    </div>

</header>

<section
    id="content"
    class="content"
></section>

</main>

</div>

<div
    id="modal"
    class="modal hidden"
></div>

<div
    id="toast"
    class="toast hidden"
></div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API =
    "https://imcongthienzz.freesrv.com";

let TOKEN =
    localStorage.getItem(
        "dashboard_token"
    ) || "";

let ME = null;

let GUILDS = [];

let GUILD = null;

let DATA = {};

/* =====================================================
   HELPERS
===================================================== */

const $ =
    id =>
        document.getElementById(id);

function esc(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c])
    );
}

function val(id){

    return (
        $(id)?.value || ""
    );
}

async function api(
    path,
    options = {}
){

    options.headers = {
        ...(options.headers || {}),

        Authorization:
            "Bearer " +
            TOKEN,

        "Content-Type":
            "application/json"
    };

    const response =
        await fetch(
            API + path,
            options
        );

    let data = {};

    try{
        data =
            await response.json();
    }catch{}

    if(
        !response.ok
    ){
        throw new Error(
            data.error ||
            "Có lỗi xảy ra."
        );
    }

    return data;
}

function toast(message){

    const t =
        $("toast");

    t.textContent =
        message;

    t.classList.remove(
        "hidden"
    );

    setTimeout(
        () =>
            t.classList.add(
                "hidden"
            ),
        3000
    );
}

function login(){

    location.href =
        API +
        "/auth/discord";
}

/* =====================================================
   ROUTING
===================================================== */

function route(){

    const parts =
        location.hash
            .replace(
                /^#/,
                ""
            )
            .split("/");

    if(
        parts[0] ===
        "manage"
    ){
        return {
            guildId:
                parts[1],

            page:
                parts[2] ||
                "panels"
        };
    }

    return {
        page:
            "servers"
    };
}

function go(page){

    if(!GUILD)
        return;

    location.hash =
        `manage/${GUILD.id}/${page}`;
}

/* =====================================================
   BOOT
===================================================== */

async function boot(){

    const hash =
        location.hash;

    if(
        hash.startsWith(
            "#auth="
        )
    ){

        TOKEN =
            hash.substring(
                6
            );

        localStorage.setItem(
            "dashboard_token",
            TOKEN
        );

        history.replaceState(
            null,
            "",
            location.pathname
        );
    }

    if(!TOKEN){

        showLogin();

        return;
    }

    try{

        ME =
            (
                await api(
                    "/api/me"
                )
            ).user;

        $("userName").textContent =
            ME.global_name ||
            ME.username;

        if(
            ME.avatar
        ){

            $("userAvatar").src =
                `https://cdn.discordapp.com/avatars/${ME.id}/${ME.avatar}.png?size=128`;

        }else{

            $("userAvatar").src =
                "https://cdn.discordapp.com/embed/avatars/0.png";
        }

        GUILDS =
            (
                await api(
                    "/api/guilds"
                )
            ).guilds;

        renderServers();

        const r =
            route();

        if(
            r.guildId
        ){

            await selectGuild(
                r.guildId,
                false
            );

            await renderPage(
                r.page
            );

        }else{

            showServers();

        }

    }catch(err){

        localStorage.removeItem(
            "dashboard_token"
        );

        TOKEN = "";

        showLogin();

        toast(
            err.message
        );
    }
}

/* =====================================================
   LOGIN / SERVERS
===================================================== */

function showLogin(){

    $("login")
        .classList
        .remove(
            "hidden"
        );

    $("app")
        .classList
        .add(
            "hidden"
        );
}

function showApp(){

    $("login")
        .classList
        .add(
            "hidden"
        );

    $("app")
        .classList
        .remove(
            "hidden"
        );
}

function renderServers(){

    $("serverSelect").innerHTML =
        GUILDS.map(
            g =>
                `<option value="${g.id}">
                    ${esc(g.name)}
                </option>`
        ).join("");
}

function showServers(){

    showApp();

    $("content").innerHTML = `

        <h1 class="title">
            Server của bạn
        </h1>

        <p class="subtitle">
            Chọn một server để quản lý
        </p>

        <div class="grid2">

        ${
            GUILDS.map(
                g => `

                <div class="card">

                    <div class="body">

                        <div
                            style="
                                display:flex;
                                gap:15px;
                                align-items:center
                            "
                        >

                            <img
                                class="avatar"
                                style="
                                    width:58px;
                                    height:58px
                                "
                                src="${
                                    g.icon ||
                                    "https://cdn.discordapp.com/embed/avatars/0.png"
                                }"
                            >

                            <div>

                                <h2>
                                    ${esc(g.name)}
                                </h2>

                                <div class="muted">

                                    ${
                                        g.botInstalled
                                        ? "🟢 Bot đang ở server"
                                        : "⚪ Bot chưa vào server"
                                    }

                                </div>

                            </div>

                        </div>

                        <button
                            class="primary"
                            style="
                                width:100%;
                                margin-top:18px
                            "
                            ${
                                g.botInstalled
                                ? ""
                                : "disabled"
                            }

                            onclick="
                                selectGuild(
                                    '${g.id}',
                                    true
                                )
                            "
                        >

                            ${
                                g.botInstalled
                                ? "⚙ Quản lý server"
                                : "＋ Bot chưa vào server"
                            }

                        </button>

                    </div>

                </div>
            `
            ).join("")
        }

        </div>
    `;
}

async function selectGuild(
    id,
    redirect = true
){

    const g =
        GUILDS.find(
            x =>
                x.id === id
        );

    if(!g)
        return;

    if(
        !g.botInstalled
    ){

        toast(
            "Bot chưa vào server này."
        );

        return;
    }

    try{

        const result =
            await api(
                `/api/guild/${g.id}`
            );

        GUILD = {
            ...g,
            ...result.guild
        };

        showApp();

        $("serverSelect").value =
            g.id;

        if(
            redirect
        ){
            go(
                "panels"
            );
        }

    }catch(err){

        toast(
            err.message
        );
    }
}

/* =====================================================
   NAV
===================================================== */

document
.querySelectorAll(
    ".nav button"
)
.forEach(
    button => {

        button.onclick =
            () =>
                go(
                    button.dataset.page
                );
    }
);

$("serverSelect").onchange =
    () =>
        selectGuild(
            $("serverSelect").value,
            true
        );

window.addEventListener(
    "hashchange",
    async () => {

        const r =
            route();

        if(
            r.guildId &&
            (
                !GUILD ||
                GUILD.id !==
                r.guildId
            )
        ){

            await selectGuild(
                r.guildId,
                false
            );
        }

        if(
            r.page
        ){

            await renderPage(
                r.page
            );
        }
    }
);

async function renderPage(
    page
){

    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            b =>
                b.classList.toggle(
                    "active",
                    b.dataset.page ===
                    page
                )
        );

    const pages = {

        tickets:
            renderTickets,

        transcripts:
            renderTranscripts,

        panels:
            renderPanels,

        teams:
            renderTeams,

        blacklist:
            renderBlacklist,

        "audit-log":
            renderAudit,

        settings:
            renderSettings
    };

    (
        pages[page] ||
        renderPanels
    )();
}

/* =====================================================
   CHANNELS / ROLES
===================================================== */

async function getChannels(){

    DATA.channels =
        (
            await api(
                `/api/guild/${GUILD.id}/channels`
            )
        ).channels;

    return DATA.channels;
}

async function getRoles(){

    DATA.roles =
        (
            await api(
                `/api/guild/${GUILD.id}/roles`
            )
        ).roles;

    return DATA.roles;
}

/* =====================================================
   PANELS
===================================================== */

async function renderPanels(){

    const result =
        await api(
            `/api/guild/${GUILD.id}/panels`
        );

    await getChannels();

    const panels =
        result.panels;

    $("content").innerHTML = `

        <h1 class="title">
            Panels của Server
            ${esc(GUILD.name)}
        </h1>

        <p class="subtitle">
            Xem và quản lý toàn bộ Panel
        </p>

        <div class="card">

            <div class="cardhead">

                <h2>
                    Panels
                </h2>

                <div class="actions">

                    <button
                        class="secondary"
                        onclick="alert('Thư viện mẫu Panel sẽ được mở rộng.')"
                    >
                        ◉ Thư viện mẫu
                    </button>

                    <button
                        class="primary"
                        onclick="panelModal()"
                    >
                        ＋ Tạo Panel
                    </button>

                </div>

            </div>

            <div class="body">

                <p>
                    Bạn đã sử dụng
                    <b>${panels.length}</b>
                    trên
                    <b>3</b>
                    Panel
                </p>

                ${
                    panels.length
                    ?

                    `

                    <div class="panelrow head">

                        <div>
                            KÊNH
                        </div>

                        <div>
                            TÊN PANEL
                        </div>

                        <div>
                            TRẠNG THÁI
                        </div>

                        <div>
                            TIN NHẮN
                        </div>

                        <div>
                            THAO TÁC
                        </div>

                    </div>

                    ${
                        panels.map(
                            p => {

                                const c =
                                    DATA.channels.find(
                                        x =>
                                            x.id ===
                                            p.channelId
                                    );

                                return `

                                <div class="panelrow">

                                    <div>
                                        #${esc(
                                            c?.name ||
                                            p.channelId
                                        )}

function previewPanel(){

    const title =
        val("pt") ||
        "Mở Ticket";

    const description =
        val("pd") ||
        "Nhấn nút bên dưới để mở một ticket.";

    const button =
        val("pbl") ||
        "Mở Ticket";

    const emoji =
        val("pbe") ||
        "🎫";

    $("panelPreview").innerHTML = `

        <h3>
            ${esc(title)}
        </h3>

        <p>
            ${esc(description)}
        </p>

        <button>
            ${esc(emoji)}
            ${esc(button)}
        </button>

    `;
}

function closeModal(){

    $("modal")
        .classList
        .add(
            "hidden"
        );
}

async function editPanel(id){

    const result =
        await api(
            `/api/guild/${GUILD.id}/panels`
        );

    const panel =
        result.panels.find(
            p =>
                p.id === id
        );

    if(
        panel
    ){
        panelModal(
            panel
        );
    }
}

async function savePanel(id){

    const body = {

        name:
            val("pn"),

        title:
            val("pt"),

        description:
            val("pd"),

        color:
            val("pco"),

        footer:
            val("pf"),

        thumbnailUrl:
            val("pthumb"),

        imageUrl:
            val("pimage"),

        buttonText:
            val("pbl"),

        buttonColor:
            val("pbc"),

        buttonEmoji:
            val("pbe"),

        channelId:
            val("pc"),

        categoryId:
            val("pca"),

        supportRoleId:
            val("pr"),

        transcripts:
            val("pts") !==
            "false",

        welcomeTitle:
            val("pwt"),

        welcomeDescription:
            val("pwd")
    };

    try{

        if(id){

            await api(
                `/api/guild/${GUILD.id}/panels/${id}`,
                {
                    method:
                        "PATCH",

                    body:
                        JSON.stringify(
                            body
                        )
                }
            );

            toast(
                "✅ Đã cập nhật Panel."
            );

        }else{

            await api(
                `/api/guild/${GUILD.id}/panels`,
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            body
                        )
                }
            );

            toast(
                "✅ Đã tạo Panel và bot đã gửi vào Discord."
            );
        }

        closeModal();

        await renderPanels();

    }catch(err){

        toast(
            err.message
        );
    }
}

async function deletePanel(
    id
){

    if(
        !confirm(
            "Bạn chắc chắn muốn xóa Panel này?"
        )
    ){
        return;
    }

    try{

        await api(
            `/api/guild/${GUILD.id}/panels/${id}`,
            {
                method:
                    "DELETE"
            }
        );

        closeModal();

        toast(
            "🗑 Đã xóa Panel."
        );

        renderPanels();

    }catch(err){

        toast(
            err.message
        );
    }
}

function showTeamMembers(){

    const team =
        DATA.teams.find(
            t =>
                t.id ===
                val(
                    "teamSelect"
                )
        );

    if(!team)
        return;

    $("teamMembers").innerHTML = `

        <div class="grid2">

            <div>

                <h3>
                    Thành viên
                </h3>

                ${
                    team.roleIds.length

                    ?

                    team.roleIds
                    .map(
                        id =>
                            `
                            <div class="card">
                                <div class="body">
                                    @${esc(
                                        DATA.roles.find(
                                            r =>
                                                r.id ===
                                                id
                                        )?.name ||
                                        id
                                    )}
                                </div>
                            </div>
                            `
                    )
                    .join("")

                    :

                    `
                    <div class="empty">
                        Chưa có thành viên
                    </div>
                    `
                }

            </div>

            <div>

                <h3>
                    Thêm Role
                </h3>

                <select
                    id="teamRole"
                    class="select"
                >

                    ${
                        DATA.roles
                        .map(
                            r =>
                                `
                                <option
                                    value="${r.id}"
                                >
                                    @${esc(
                                        r.name
                                    )}
                                </option>
                                `
                        )
                        .join("")
                    }

                </select>

                <button
                    class="success"
                    style="margin-top:12px"
                    onclick="addTeamRole()"

                    ＋ Thêm vào nhóm
                </button>

            </div>

        </div>
    `;
}

async function createTeam(){

    const name =
        val(
            "teamName"
        ).trim();

    if(!name){

        toast(
            "Nhập tên nhóm."
        );

        return;
    }

    try{

        await api(
            `/api/guild/${GUILD.id}/teams`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        toast(
            "✅ Đã tạo nhóm."
        );

        renderTeams();

    }catch(err){

        toast(
            err.message
        );
    }
}

async function addTeamRole(){

    try{

        await api(
            `/api/guild/${GUILD.id}/teams/${val("teamSelect")}/roles`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        roleId:
                            val("teamRole")
                    })
            }
        );

        toast(
            "✅ Đã thêm Role."
        );

        renderTeams();

    }catch(err){

        toast(
            err.message
        );
    }
}

                    .join("")

async function blackUser(){

    const id =
        prompt(
            "Nhập User ID:"
        );

    if(!id)
        return;

    await api(
        `/api/guild/${GUILD.id}/blacklist/user`,
        {
            method:
                "POST",

            body:
                JSON.stringify({
                    userId:
                        id.trim()
                })
        }
    );

    toast(
        "✅ Đã chặn User."
    );

    renderBlacklist();
}

async function blackRole(){

    const roles =
        await getRoles();

    const text =
        roles
        .map(
            (r,i) =>
                `${i}: ${r.name}`
        )
        .join("\n");

    const choice =
        prompt(
            "Nhập số Role:\n\n" +
            text
        );

    if(
        choice ===
        null
    )
        return;

    const role =
        roles[
            Number(
                choice
            )
        ];

    if(!role){

        toast(
            "Role không hợp lệ."
        );

        return;
    }

    await api(
        `/api/guild/${GUILD.id}/blacklist/role`,
        {
            method:
                "POST",

            body:
                JSON.stringify({
                    roleId:
                        role.id
                })
        }
    );

    toast(
        "✅ Đã chặn Role."
    );

    renderBlacklist();
}

async function unblack(
    kind,
    id
){

    await api(
        `/api/guild/${GUILD.id}/blacklist/${kind}/${id}`,
        {
            method:
                "DELETE"
        }
    );

    toast(
        "✅ Đã bỏ chặn."
    );

    renderBlacklist();
}
