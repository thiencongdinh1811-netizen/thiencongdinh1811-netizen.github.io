<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tickets | Bảng điều khiển</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#0f192b;
    --sidebar:#1b283a;
    --panel:#202e43;
    --panel2:#1d2a3d;
    --input:#3a485d;
    --border:#344359;
    --blue:#2166f3;
    --green:#21c87a;
    --red:#ed4245;
    --text:#f5f7fb;
    --muted:#b8c5d7;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* =====================================================
   LOGIN
===================================================== */

#login{
    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 20%,
            #243b69,
            #0a101c 65%
        );
}

.login-box{
    width:min(440px,92vw);

    padding:42px;

    background:#182231;

    border:
        1px solid
        #39485c;

    border-radius:16px;

    text-align:center;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45);
}

.login-logo{
    width:82px;
    height:82px;

    margin:auto;

    border-radius:50%;

    display:grid;

    place-items:center;

    background:#5865f2;

    font-size:42px;

    font-weight:900;
}

.login-box h1{
    margin:
        22px 0 10px;
}

.login-box p{
    color:#b7c4d7;

    line-height:1.7;
}

.login-button{
    width:100%;

    margin-top:20px;

    padding:13px 18px;

    border-radius:7px;

    background:var(--blue);

    color:white;

    font-weight:700;
}

.login-button:hover{
    filter:brightness(1.12);
}

/* =====================================================
   APP
===================================================== */

.app{
    min-height:100vh;

    display:flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:80px;

    background:var(--sidebar);

    border-right:
        1px solid
        #2b3a4e;

    z-index:20;
}

.logo{
    height:82px;

    display:grid;

    place-items:center;

    border-bottom:
        1px solid
        #2d3b50;

    font-size:25px;
}

/* =====================================================
   NAV
===================================================== */

.nav{
    display:flex;

    flex-direction:column;
}

.nav-button{
    position:relative;

    width:100%;

    height:64px;

    background:transparent;

    color:white;

    font-size:21px;

    border-left:
        3px solid
        transparent;
}

.nav-button:hover,
.nav-button.active{
    background:#26364c;

    border-left-color:
        #2775ff;
}

/*
    Tooltip giống kiểu Tickets v2
*/
.nav-button::after{
    content:attr(data-tooltip);

    position:absolute;

    left:74px;

    top:50%;

    transform:
        translateY(-50%)
        translateX(-5px);

    opacity:0;

    pointer-events:none;

    white-space:nowrap;

    background:#111923;

    border:
        1px solid
        #43536a;

    color:white;

    padding:
        8px 12px;

    border-radius:6px;

    font-size:13px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

    transition:
        .15s ease;

    z-index:100;
}

.nav-button:hover::after{
    opacity:1;

    transform:
        translateY(-50%)
        translateX(0);
}

/* =====================================================
   MAIN
===================================================== */

.main{
    width:
        calc(100% - 80px);

    margin-left:80px;

    min-height:100vh;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{
    position:sticky;

    top:0;

    z-index:10;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 28px;

    background:#111c2e;

    border-bottom:
        1px solid
        #28374b;
}

.server-select{
    min-width:280px;

    padding:
        10px 13px;

    border-radius:6px;

    border:
        1px solid
        #506078;

    background:#35445a;

    color:white;
}

.user-box{
    display:flex;

    align-items:center;

    gap:10px;
}

.avatar{
    width:38px;
    height:38px;

    border-radius:50%;

    object-fit:cover;

    background:#5865f2;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    max-width:1160px;

    margin:auto;

    padding:
        35px 30px 80px;
}

.title{
    text-align:center;

    margin:
        8px 0 7px;

    font-size:30px;
}

.subtitle{
    text-align:center;

    color:#b8c5d7;

    margin-bottom:34px;
}

/* =====================================================
   CARDS
===================================================== */

.card{
    margin:
        22px 0;

    overflow:hidden;

    background:var(--panel);

    border:
        1px solid
        #28384e;

    border-radius:12px;
}

.card-header{
    min-height:60px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        14px 16px;

    border-bottom:
        1px solid
        #36465c;
}

.card-header h2{
    margin:0;

    font-size:20px;
}

.card-body{
    padding:20px;
}

/* =====================================================
   BUTTONS
===================================================== */

.primary{
    padding:
        10px 16px;

    border-radius:6px;

    background:var(--blue);

    color:white;

    font-weight:700;
}

.primary:hover{
    filter:brightness(1.12);
}

.secondary{
    padding:
        10px 16px;

    border-radius:6px;

    background:#46546a;

    color:white;
}

.success{
    padding:
        10px 16px;

    border-radius:6px;

    background:#168b55;

    color:white;
}

.danger{
    padding:
        10px 16px;

    border-radius:6px;

    background:#ed4245;

    color:white;
}

/* =====================================================
   INPUT
===================================================== */

.input,
.select,
.textarea{
    width:100%;

    padding:
        11px 13px;

    border-radius:5px;

    border:
        1px solid
        #526176;

    background:var(--input);

    color:white;

    outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:
        #638dff;
}

.textarea{
    min-height:150px;

    resize:vertical;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;

    margin-bottom:8px;

    font-weight:600;
}

.grid-2{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:16px;
}

.grid-3{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

/* =====================================================
   FILTER
===================================================== */

.filter-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

/* =====================================================
   TABLE
===================================================== */

.table-wrap{
    overflow-x:auto;
}

.table{
    width:100%;

    border-collapse:collapse;
}

.table th{
    padding:
        14px 12px;

    text-align:left;

    background:#3d4b60;

    font-size:12px;

    text-transform:uppercase;

    color:white;
}

.table td{
    padding:
        16px 12px;

    border-bottom:
        1px solid
        #344359;
}

.table tr:hover{
    background:#26364a;
}

.badge{
    display:inline-block;

    padding:
        5px 9px;

    border-radius:5px;

    background:#2659a7;

    color:white;

    font-size:12px;
}

/* =====================================================
   PANEL ROW
===================================================== */

.panel-row{
    display:grid;

    grid-template-columns:
        1.2fr
        1.2fr
        .7fr
        .8fr
        70px;

    gap:10px;

    align-items:center;

    padding:
        14px 8px;

    border-bottom:
        1px solid
        #344359;
}

.panel-head{
    color:#b8c5d7;

    font-size:12px;

    text-transform:uppercase;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    padding:55px 20px;

    text-align:center;

    color:#b8c5d7;
}

.empty-icon{
    font-size:48px;

    opacity:.45;

    margin-bottom:12px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:grid;

    place-items:center;

    background:
        rgba(0,0,0,.72);

    padding:20px;
}

.modal-box{
    width:min(760px,95vw);

    max-height:92vh;

    overflow:auto;

    background:#1b2739;

    border:
        1px solid
        #46576e;

    border-radius:10px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.5);
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
        18px;

    border-bottom:
        1px solid
        #3c4b60;
}

.modal-header h2{
    margin:0;
}

.close{
    background:transparent;

    color:white;

    font-size:25px;
}

.modal-body{
    padding:20px;
}

/* =====================================================
   TRANSCRIPT
===================================================== */

.transcript-message{
    display:flex;

    gap:12px;

    padding:
        14px 4px;

    border-bottom:
        1px solid
        #344359;
}

.transcript-avatar{
    width:40px;
    height:40px;

    border-radius:50%;

    object-fit:cover;
}

.transcript-author{
    font-weight:700;
}

.transcript-time{
    margin-left:8px;

    color:#8e9bb0;

    font-size:12px;
}

.transcript-content{
    margin-top:5px;

    white-space:pre-wrap;

    word-break:break-word;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    right:22px;

    bottom:22px;

    z-index:300;

    padding:
        13px 18px;

    border:
        1px solid
        #52637a;

    border-radius:7px;

    background:#202e43;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.35);
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .grid-2,
    .grid-3,
    .filter-grid{
        grid-template-columns:
            1fr;
    }

    .panel-row{
        grid-template-columns:
            1fr;
    }

    .topbar{
        padding:
            0 12px;
    }

    .server-select{
        min-width:160px;
    }

    .content{
        padding:
            20px 12px 60px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="login-box">

        <div class="login-logo">
            🎫
        </div>

        <h1>
            Tickets
        </h1>

        <p>
            Đăng nhập bằng Discord để quản lý
            Ticket, Panel, Transcript và hệ thống hỗ trợ.
        </p>

        <button
            class="login-button"
            onclick="loginDiscord()"
        >
            🎮 Đăng nhập bằng Discord
        </button>

    </div>

</div>

<!-- =====================================================
     APP
===================================================== -->

<div
    id="app"
    class="app hidden"
>

    <aside class="sidebar">

        <div class="logo">
            🎫
        </div>

        <nav class="nav">

            <button
                class="nav-button"
                data-page="tickets"
                data-tooltip="Ticket đang mở"
            >
                🎟️
            </button>

            <button
                class="nav-button"
                data-page="transcripts"
                data-tooltip="Transcript"
            >
                🧾
            </button>

            <button
                class="nav-button"
                data-page="panels"
                data-tooltip="Panel"
            >
                ▣
            </button>

            <button
                class="nav-button"
                data-page="teams"
                data-tooltip="Đội hỗ trợ"
            >
                👥
            </button>

            <button
                class="nav-button"
                data-page="blacklist"
                data-tooltip="Danh sách chặn"
            >
                ⛔
            </button>

            <button
                class="nav-button"
                data-page="audit"
                data-tooltip="Nhật ký hoạt động"
            >
                ↶
            </button>

            <button
                class="nav-button"
                data-page="settings"
                data-tooltip="Cài đặt"
            >
                ⚙️
            </button>

        </nav>

    </aside>

    <main class="main">

        <header class="topbar">

            <select
                id="serverSelect"
                class="server-select"
            ></select>

            <div class="user-box">

                <img
                    id="userAvatar"
                    class="avatar"
                >

                <span
                    id="userName"
                >
                </span>

            </div>

        </header>

        <section
            id="content"
            class="content"
        ></section>

    </main>

</div>

<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modal"
    class="modal hidden"
></div>

<div
    id="toast"
    class="toast hidden"
></div>

<script>

/* =====================================================
   CONFIG
===================================================== */

/*
    KHÔNG đổi thành GitHub Pages.

    API luôn trỏ về BACKEND.
*/
const API =
    "https://imcongthienzz.freesrv.com";

let ME = null;

let GUILDS = [];

let GUILD = null;

let DATA = {};

/* =====================================================
   ELEMENTS
===================================================== */

const login =
    document.getElementById(
        "login"
    );

const app =
    document.getElementById(
        "app"
    );

const content =
    document.getElementById(
        "content"
    );

const modal =
    document.getElementById(
        "modal"
    );

const toastBox =
    document.getElementById(
        "toast"
    );

const serverSelect =
    document.getElementById(
        "serverSelect"
    );

const userName =
    document.getElementById(
        "userName"
    );

const userAvatar =
    document.getElementById(
        "userAvatar"
    );

/* =====================================================
   HELPERS
===================================================== */

function esc(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#39;"
        })[char]
    );
}

function val(id){

    return (
        document.getElementById(
            id
        )?.value || ""
    );
}

function toast(message){

    toastBox.textContent =
        message;

    toastBox.classList.remove(
        "hidden"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {
                toastBox.classList.add(
                    "hidden"
                );
            },
            3000
        );
}

/* =====================================================
   API
===================================================== */

async function api(
    endpoint,
    options = {}
){

    const config = {
        ...options,

        credentials:
            "include",

        headers: {
            ...(options.headers || {}),

            "Content-Type":
                "application/json"
        }
    };

    const response =
        await fetch(
            API + endpoint,
            config
        );

    let data = {};

    try {
        data =
            await response.json();
    } catch {}

    if (
        response.status ===
        401
    ) {
        showLogin();

        throw new Error(
            "Phiên đăng nhập đã hết hạn."
        );
    }

    if (
        !response.ok
    ) {
        throw new Error(
            data.error ||
            "Có lỗi xảy ra."
        );
    }

    return data;
}

/* =====================================================
   LOGIN
===================================================== */

function loginDiscord(){

    /*
        CỰC KỲ QUAN TRỌNG:

        Không tạo OAuth URL ở index.html.

        Backend tự tạo state,
        redirect_uri và response_type=code.
    */

    window.location.href =
        API +
        "/auth/discord";
}

/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try {

        await api(
            "/api/logout",
            {
                method:
                    "POST"
            }
        );

    } catch {}

    location.reload();
}

/* =====================================================
   SHOW
===================================================== */

function showLogin(){

    login.classList.remove(
        "hidden"
    );

    app.classList.add(
        "hidden"
    );
}

function showApp(){

    login.classList.add(
        "hidden"
    );

    app.classList.remove(
        "hidden"
    );
}

/* =====================================================
   ROUTE
===================================================== */

function route(){

    const hash =
        location.hash
            .slice(1)
            .split("/");

    if (
        hash[0] ===
        "manage"
    ) {
        return {
            guildId:
                hash[1],

            page:
                hash[2] ||
                "panels",

            extra:
                hash[3] ||
                null
        };
    }

    return {
        page:
            "servers"
    };
}

function go(
    page
){

    if (!GUILD){
        return;
    }

    location.hash =
        `manage/${GUILD.id}/${page}`;
}

/* =====================================================
   BOOT
===================================================== */

async function boot(){

    /*
        Xóa hoàn toàn auth hash cũ.
    */
    if (
        location.hash.includes(
            "auth="
        )
    ) {
        history.replaceState(
            null,
            "",
            location.pathname +
            location.search
        );
    }

    try {

        ME =
            (
                await api(
                    "/api/me"
                )
            ).user;

        userName.textContent =
            ME.global_name ||
            ME.username;

        userAvatar.src =
            ME.avatarUrl;

        GUILDS =
            (
                await api(
                    "/api/guilds"
                )
            ).guilds;

        showApp();

        const r =
            route();

        if (
            r.guildId
        ) {

            await selectGuild(
                r.guildId,
                false
            );

            await renderPage(
                r.page
            );

        } else {

            showServers();

        }

    } catch (e) {

        console.log(
            "Chưa đăng nhập:",
            e.message
        );

        showLogin();
    }
}

/* =====================================================
   SERVERS
===================================================== */

function renderServerOptions(){

    serverSelect.innerHTML =
        GUILDS.map(
            guild => `
                <option value="${guild.id}">
                    ${esc(guild.name)}
                </option>
            `
        ).join("");

    serverSelect.onchange =
        () => {
            selectGuild(
                serverSelect.value,
                true
            );
        };
}

function showServers(){

    renderServerOptions();

    showApp();

    content.innerHTML = `
        <h1 class="title">
            Máy chủ của bạn
        </h1>

        <p class="subtitle">
            Chọn máy chủ để quản lý hệ thống Ticket
        </p>

        <div class="grid-2">

            ${GUILDS.map(
                guild => `
                    <div class="card">

                        <div class="card-body">

                            <div
                                style="
                                    display:flex;
                                    gap:15px;
                                    align-items:center;
                                "
                            >

                                <img
                                    class="avatar"
                                    style="
                                        width:60px;
                                        height:60px;
                                    "
                                    src="${
                                        guild.icon ||
                                        "https://cdn.discordapp.com/embed/avatars/0.png"
                                    }"
                                >

                                <div>

                                    <h2>
                                        ${esc(
                                            guild.name
                                        )}
                                    </h2>

                                    <div
                                        style="
                                            color:#b8c5d7;
                                        "
                                    >
                                        ${
                                            guild.botInstalled
                                                ? "🟢 Bot đã ở trong server"
                                                : "⚪ Bot chưa ở trong server"
                                        }
                                    </div>

                                </div>

                            </div>

                            <button
                                class="primary"
                                style="
                                    width:100%;
                                    margin-top:18px;
                                "
                                ${
                                    guild.botInstalled
                                        ? ""
                                        : "disabled"
                                }
                                onclick="
                                    selectGuild(
                                        '${guild.id}',
                                        true
                                    )
                                "
                            >
                                ${
                                    guild.botInstalled
                                        ? "⚙️ Quản lý Server"
                                        : "➕ Bot chưa vào Server"
                                }
                            </button>

                        </div>

                    </div>
                `
            ).join("")}

        </div>
    `;
}

/* =====================================================
   SELECT GUILD
===================================================== */

async function selectGuild(
    guildId,
    redirect = true
){

    const guild =
        GUILDS.find(
            g =>
                g.id ===
                guildId
        );

    if (!guild){
        return showServers();
    }

    if (
        !guild.botInstalled
    ) {
        toast(
            "Bot chưa có trong server này."
        );

        return;
    }

    try {

        const data =
            await api(
                `/api/guild/${guild.id}`
            );

        GUILD = {
            ...guild,
            ...data.guild
        };

        serverSelect.value =
            guild.id;

        if (
            redirect
        ) {
            go(
                "panels"
            );
        }

    } catch (e) {

        toast(
            e.message
        );
    }
}

/* =====================================================
   NAV
===================================================== */

document
    .querySelectorAll(
        ".nav-button"
    )
    .forEach(
        button => {

            button.onclick =
                () => {

                    go(
                        button.dataset.page
                    );
                };
        }
    );

window.addEventListener(
    "hashchange",
    async () => {

        const r =
            route();

        if (
            r.guildId &&
            (
                !GUILD ||
                GUILD.id !==
                r.guildId
            )
        ) {
            await selectGuild(
                r.guildId,
                false
            );
        }

        if (
            r.guildId
        ) {
            await renderPage(
                r.page,
                r.extra
            );
        }
    }
);

/* =====================================================
   PAGE
===================================================== */

async function renderPage(
    page,
    extra
){

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page ===
                    page
                );
            }
        );

    const pages = {
        tickets:
            renderTickets,

        transcripts:
            renderTranscripts,

        panels:
            renderPanels,

        teams:
            renderTeams,

        blacklist:
            renderBlacklist,

        audit:
            renderAudit,

        settings:
            renderSettings
    };

    if (
        page ===
        "transcripts" &&
        extra
    ) {
        return renderTranscriptView(
            extra
        );
    }

    if (
        pages[page]
    ) {
        return pages[page]();
    }

    renderPanels();
}

async function editPanel(
    panelId
){

    const result =
        await api(
            `/api/guild/${GUILD.id}/panels`
        );

    const panel =
        result.panels.find(
            p =>
                p.id ===
                panelId
        );

    if (panel){
        panelModal(
            panel
        );
    }
}

async function savePanel(
    panelId
){

    const body = {

        name:
            val("pn"),

        channelId:
            val("pc"),

        title:
            val("pt"),

        description:
            val("pd"),

        color:
            val("pco"),

        footer:
            val("pf"),

        buttonLabel:
            val("pbl"),

        buttonEmoji:
            val("pbe"),

        categoryId:
            val("pca"),

        supportRoleId:
            val("pr")
    };

    if (!body.name){
        return toast(
            "Hãy nhập tên Panel."
        );
    }

    if (!body.channelId){
        return toast(
            "Hãy chọn kênh gửi Panel."
        );
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/panels${
                panelId
                    ? "/" + panelId
                    : ""
            }`,
            {
                method:
                    panelId
                        ? "PATCH"
                        : "POST",

                body:
                    JSON.stringify(
                        body
                    )
            }
        );

        closeModal();

        toast(
            panelId
                ? "✅ Đã cập nhật Panel."
                : "✅ Đã tạo Panel và gửi vào Discord."
        );

        await renderPanels();

    } catch (e) {

        toast(
            e.message
        );
    }
}

async function deletePanel(
    panelId
){

    if (
        !confirm(
            "Bạn chắc chắn muốn xóa Panel này?"
        )
    ) {
        return;
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/panels/${panelId}`,
            {
                method:
                    "DELETE"
            }
        );

        closeModal();

        toast(
            "✅ Đã xóa Panel."
        );

        renderPanels();

    } catch (e) {

        toast(
            e.message
        );
    }
}

    modal.classList.add(
        "hidden"
    );
}

async function createTeam(){

    const name =
        val(
            "teamName"
        );

    if (!name){
        return toast(
            "Hãy nhập tên đội."
        );
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/teams`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        toast(
            "✅ Đã tạo đội."
        );

        renderTeams();

    } catch (e) {

        toast(
            e.message
        );
    }
}

async function deleteTeam(
    teamId
){

    if (
        !confirm(
            "Bạn chắc chắn muốn xóa đội này?"
        )
    ){
        return;
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/teams/${teamId}`,
            {
                method:
                    "DELETE"
            }
        );

        renderTeams();

    } catch (e) {

        toast(
            e.message
        );
    }
}

async function addTeamRole(
    teamId
){

    const roleId =
        val(
            `role_${teamId}`
        );

    if (!roleId){
        return toast(
            "Hãy chọn Role."
        );
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/teams/${teamId}/roles`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        roleId
                    })
            }
        );

        renderTeams();

    } catch (e) {

        toast(
            e.message
        );
    }
}

async function blacklistUser(){

    const userId =
        prompt(
            "Nhập User ID cần chặn:"
        );

    if (!userId){
        return;
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/blacklist/user`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        userId
                    })
            }
        );

        renderBlacklist();

    } catch (e) {

        toast(
            e.message
        );
    }
}

async function blacklistRole(){

    const rs =
        await roles();

    const text =
        rs.map(
            (r, i) =>
                `${i}: @${r.name}`
        ).join("\n");

    const choice =
        prompt(
            "Chọn số Role:\n\n" +
            text
        );

    if (
        choice ===
        null
    ){
        return;
    }

    const role =
        rs[
            Number(
                choice
            )
        ];

    if (!role){
        return toast(
            "Role không hợp lệ."
        );
    }

    try {

        await api(
            `/api/guild/${GUILD.id}/blacklist/role`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        roleId:
                            role.id
                    })
            }
        );

        renderBlacklist();

    } catch (e) {

        toast(
            e.message
        );
    }
}

async function removeBlacklist(
    kind,
    value
){

    await api(
        `/api/guild/${GUILD.id}/blacklist/${kind}/${value}`,
        {
            method:
                "DELETE"
        }
    );

    renderBlacklist();
}

/* =====================================================

===================================================== */

const params =
    new URLSearchParams(
        location.search
    );

const oauthError =
    params.get(
        "oauth_error"
    );

if (
    oauthError
) {

    history.replaceState(
        null,
        "",
        location.pathname
    );

    setTimeout(
        () => {

            const messages = {
                missing_code:
                    "Discord không trả về mã đăng nhập.",

                state:
                    "Phiên OAuth không hợp lệ hoặc đã hết hạn.",

                token:
                    "Discord không cấp được token.",

                user:
                    "Không lấy được tài khoản Discord.",

                callback:
                    "Lỗi xử lý đăng nhập Discord."
            };

            toast(
                messages[oauthError] ||
                "Đăng nhập Discord thất bại."
            );

        },
        500
    );
}
