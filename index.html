<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Tickets | Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f192b;
    color: #f5f7fb;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
    border: 0;
}

:root {
    --p: #1e2a3d;
    --p2: #202e43;
    --in: #3a485d;
    --line: #35445a;
    --blue: #2166f3;
    --muted: #b5c2d5;
}

#login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at 50% 20%,
            #172746,
            #080d17
        );
}

.loginbox {
    width: 430px;
    padding: 42px;
    background: #181f2b;
    border: 1px solid #394456;
    border-radius: 16px;
    text-align: center;
    box-shadow:
        0 20px 70px #0007;
}

.logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: auto;
    background: #5865f2;
    display: grid;
    place-items: center;
    font-size: 42px;
    font-weight: 900;
}

.loginbox h1 {
    margin: 25px 0 12px;
}

.loginbox p {
    color: #aebbd0;
    line-height: 1.7;
}

.primary {
    background: #2166f3;
    color: white;
    border-radius: 6px;
    padding: 11px 17px;
    font-weight: 700;
}

.loginbtn {
    width: 100%;
    margin-top: 18px;
}

.hidden {
    display: none !important;
}

.app {
    min-height: 100vh;
    display: flex;
}

.side {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 80px;
    background: #1c293b;
    border-right: 1px solid #2c3a4d;
    z-index: 10;
}

.brand {
    height: 82px;
    display: grid;
    place-items: center;
    font-size: 25px;
    border-bottom: 1px solid #2d3a4e;
}

.nav button {
    width: 100%;
    height: 64px;
    background: transparent;
    color: #fff;
    font-size: 21px;
    border-left: 3px solid transparent;
}

.nav button:hover,
.nav button.active {
    background: #24344b;
    border-left-color: #2775ff;
}

.main {
    margin-left: 80px;
    width: calc(100% - 80px);
    min-height: 100vh;
}

.top {
    height: 70px;
    background: #111c2e;
    border-bottom: 1px solid #27364b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 5;
}

.server-select {
    background: #35445a;
    border: 1px solid #506078;
    color: white;
    border-radius: 5px;
    padding: 10px 13px;
    min-width: 280px;
}

.user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #5865f2;
}

.content {
    max-width: 1160px;
    margin: auto;
    padding: 34px 30px 70px;
}

.title {
    text-align: center;
    margin: 8px 0 6px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #b8c5d7;
    margin-bottom: 34px;
}

.card {
    background: var(--p);
    border-radius: 12px;
    margin: 22px 0;
    border: 1px solid #25354b;
    overflow: hidden;
}

.cardhead {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.cardhead h2 {
    margin: 0;
    font-size: 22px;
}

.body {
    padding: 20px;
}

.grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;
    margin-bottom: 8px;
}

.input,
.select,
.textarea {
    width: 100%;
    background: var(--in);
    border: 1px solid #55657d;
    color: #fff;
    border-radius: 5px;
    padding: 11px 12px;
    outline: none;
}

.textarea {
    min-height: 100px;
    resize: vertical;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.secondary {
    background: #586579;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
}

.danger {
    background: #ed1b2f;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
}

.success {
    background: #087f4f;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
}

.tablewrap {
    overflow: auto;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th {
    background: #3a485d;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    color: #d8e1ed;
}

.table td,
.table th {
    padding: 14px 10px;
    border-bottom: 1px solid #344359;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    background: #24539b;
    color: #fff;
    font-size: 12px;
}

.muted {
    color: #93a3ba;
}

.empty {
    text-align: center;
    padding: 55px;
    color: #b4c0d0;
}

.panelrow {
    display: grid;
    grid-template-columns:
        1.2fr 1fr .7fr .8fr auto;
    gap: 8px;
    align-items: center;
    padding: 13px 8px;
    border-bottom: 1px solid #344359;
}

.panelrow.head {
    font-size: 12px;
    text-transform: uppercase;
    color: #b8c5d7;
}

.smallbtn {
    padding: 8px 11px;
    border-radius: 5px;
    background: #46546a;
    color: white;
}

.filtergrid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 15px;
}

.list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.listitem {
    background: #26364b;
    padding: 13px;
    border-radius: 7px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal {
    position: fixed;
    inset: 0;
    background: #0008;
    display: grid;
    place-items: center;
    z-index: 50;
}

.modalbox {
    width: min(720px, 92vw);
    max-height: 90vh;
    overflow: auto;
    background: #1b2739;
    border: 1px solid #45566e;
    border-radius: 10px;
}

.modalhead {
    padding: 18px;
    border-bottom: 1px solid #3b4a60;
    display: flex;
    justify-content: space-between;
}

.modalbody {
    padding: 20px;
}

.closex {
    background: transparent;
    color: #fff;
    font-size: 22px;
}

.toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    background: #222e42;
    border: 1px solid #53637a;
    padding: 13px 18px;
    border-radius: 7px;
    z-index: 100;
}

@media(max-width:800px) {

    .side {
        width: 58px;
    }

    .main {
        margin-left: 58px;
        width: calc(100% - 58px);
    }

    .grid2,
    .filtergrid {
        grid-template-columns: 1fr;
    }

    .panelrow {
        grid-template-columns: 1fr;
    }

    .top {
        padding: 0 12px;
    }

    .server-select {
        min-width: 160px;
    }

    .content {
        padding: 20px 12px;
    }
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="loginbox">

        <div class="logo">
            T
        </div>

        <h1>
            Tickets
        </h1>

        <p>
            Login with Discord to manage
            your server, panels, tickets
            and support system.
        </p>

        <button
            class="primary loginbtn"
            onclick="login()"
        >
            🎮 Login with Discord
        </button>

    </div>

</div>


<!-- APP -->

<div
    id="app"
    class="app hidden"
>

    <aside class="side">

        <div class="brand">
            🎫
        </div>

        <div class="nav">

            <button
                data-page="tickets"
                title="Tickets"
            >
                🎟️
            </button>

            <button
                data-page="transcripts"
                title="Transcripts"
            >
                🧾
            </button>

            <button
                data-page="panels"
                title="Panels"
            >
                ▣
            </button>

            <button
                data-page="teams"
                title="Teams"
            >
                👥
            </button>

            <button
                data-page="blacklist"
                title="Blacklist"
            >
                ⊘
            </button>

            <button
                data-page="audit-log"
                title="Audit Log"
            >
                ↶
            </button>

            <button
                data-page="settings"
                title="Settings"
            >
                ⚙
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="top">

            <select
                id="serverSelect"
                class="server-select"
            ></select>

            <div class="user">

                <img
                    id="userAvatar"
                    class="avatar"
                >

                <span
                    id="userName"
                ></span>

            </div>

        </header>


        <section
            id="content"
            class="content"
        ></section>

    </main>

</div>


<div
    id="modal"
    class="modal hidden"
></div>

<div
    id="toast"
    class="toast hidden"
></div>


<script>

const API =
    "https://imcongthienzz.freesrv.com";

let TOKEN =
    localStorage.getItem(
        "dashboard_token"
    ) || "";

let ME =
    null;

let GUILDS =
    [];

let GUILD =
    null;

let DATA =
    {};


function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#39;"

        }[char])
    );
}


function val(id) {

    return (
        document.getElementById(
            id
        )?.value || ""
    );
}


async function api(
    path,
    options = {}
) {

    options.headers = {

        ...(options.headers || {}),

        Authorization:
            "Bearer " +
            TOKEN,

        "Content-Type":
            "application/json"
    };

    const response =
        await fetch(
            API + path,
            options
        );

    let data =
        {};

    try {

        data =
            await response.json();

    } catch {}

    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed"
        );
    }

    return data;
}


function toast(
    message
) {

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        message;

    element.classList.remove(
        "hidden"
    );

    setTimeout(
        () => {

            element.classList.add(
                "hidden"
            );

        },
        2500
    );
}


function login() {

    location.href =
        API +
        "/auth/discord";
}


function route() {

    const parts =
        location.hash
            .slice(1)
            .split("/");

    if (
        parts[0] ===
        "manage"
    ) {

        return {

            guildId:
                parts[1],

            page:
                parts[2] ||
                "panels"
        };
    }

    return {
        page:
            "servers"
    };
}


function go(page) {

    if (!GUILD) {
        return;
    }

    location.hash =
        `manage/${GUILD.id}/${page}`;
}


// ============================================================
// BOOT
// ============================================================

async function boot() {

    const hash =
        location.hash.slice(1);

    if (
        hash.startsWith(
            "auth="
        )
    ) {

        TOKEN =
            hash.slice(5);

        localStorage.setItem(
            "dashboard_token",
            TOKEN
        );

        history.replaceState(
            null,
            "",
            location.pathname +
            "#"
        );
    }

    if (!TOKEN) {

        showLogin();

        return;
    }

    try {

        ME =
            (
                await api(
                    "/api/me"
                )
            ).user;

        userName.textContent =
            ME.global_name ||
            ME.username;

        userAvatar.src =
            ME.avatarUrl;

        GUILDS =
            (
                await api(
                    "/api/guilds"
                )
            ).guilds;

        renderServers();

        const routeData =
            route();

        if (
            routeData.guildId
        ) {

            await selectGuild(
                routeData.guildId,
                false
            );

            renderPage(
                routeData.page
            );

        } else {

            showServers();
        }

    } catch (error) {

        localStorage.removeItem(
            "dashboard_token"
        );

        TOKEN =
            "";

        showLogin();

        toast(
            error.message
        );
    }
}


function showLogin() {

    document
        .getElementById("login")
        .classList.remove(
            "hidden"
        );

    document
        .getElementById("app")
        .classList.add(
            "hidden"
        );
}


function showApp() {

    document
        .getElementById("login")
        .classList.add(
            "hidden"
        );

    document
        .getElementById("app")
        .classList.remove(
            "hidden"
        );
}


// ============================================================
// SERVERS
// ============================================================

function renderServers() {

    serverSelect.innerHTML =
        GUILDS.map(
            guild => `

                <option
                    value="${guild.id}"
                >
                    ${esc(guild.name)}
                    ${
                        guild.botInstalled
                            ? ""
                            : " — Bot not installed"
                    }
                </option>
            `
        ).join("");

    serverSelect.onchange =
        () =>
            selectGuild(
                serverSelect.value,
                true
            );
}


function showServers() {

    showApp();

    content.innerHTML = `

        <h1 class="title">
            Your Servers
        </h1>

        <p class="subtitle">
            Select a server to manage
        </p>

        <div class="grid2">

            ${GUILDS.map(
                guild => `

                    <div class="card">

                        <div class="body">

                            <div
                                style="
                                    display:flex;
                                    gap:15px;
                                    align-items:center
                                "
                            >

                                <img
                                    class="avatar"
                                    style="
                                        width:58px;
                                        height:58px
                                    "
                                    src="${
                                        guild.icon ||
                                        "https://cdn.discordapp.com/embed/avatars/0.png"
                                    }"
                                >

                                <div>

                                    <h2>
                                        ${esc(guild.name)}
                                    </h2>

                                    <div class="muted">

                                        ${
                                            guild.botInstalled
                                                ? "🟢 Bot is in server"
                                                : "⚪ Bot is not in server"
                                        }

                                    </div>

                                </div>

                            </div>

                            <button
                                class="primary"
                                style="
                                    width:100%;
                                    margin-top:18px
                                "
                                ${
                                    guild.botInstalled
                                        ? ""
                                        : "disabled"
                                }
                                onclick="
                                    selectGuild(
                                        '${guild.id}',
                                        true
                                    )
                                "
                            >

                                ${
                                    guild.botInstalled
                                        ? "⚙ Manage Server"
                                        : "＋ Bot not in server"
                                }

                            </button>

                        </div>

                    </div>
                `
            ).join("")}

        </div>
    `;
}


async function selectGuild(
    id,
    redirect = true
) {

    const guild =
        GUILDS.find(
            x =>
                x.id === id
        );

    if (!guild) {

        return showServers();
    }

    if (!guild.botInstalled) {

        return toast(
            "Bot chưa vào server này"
        );
    }

    try {

        GUILD = {

            ...guild,

            ...(
                await api(
                    "/api/guild/" +
                    guild.id
                )
            ).guild
        };

        showApp();

        serverSelect.value =
            guild.id;

        if (redirect) {

            go(
                "panels"
            );
        }

    } catch (error) {

        toast(
            error.message
        );
    }
}


// ============================================================
// NAVIGATION
// ============================================================

async function renderPage(
    page
) {

    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page ===
                    page
                );
            }
        );

    const pages = {

        tickets:
            renderTickets,

        transcripts:
            renderTranscripts,

        panels:
            renderPanels,

        teams:
            renderTeams,

        blacklist:
            renderBlacklist,

        "audit-log":
            renderAudit,

        settings:
            renderSettings
    };

    (
        pages[page] ||
        renderPanels
    )();
}


document
    .querySelectorAll(
        ".nav button"
    )
    .forEach(
        button => {

            button.onclick =
                () =>
                    go(
                        button.dataset.page
                    );
        }
    );


addEventListener(
    "hashchange",
    async () => {

        const routeData =
            route();

        if (
            routeData.guildId &&
            (
                !GUILD ||
                GUILD.id !==
                routeData.guildId
            )
        ) {

            await selectGuild(
                routeData.guildId,
                false
            );
        }

        renderPage(
            routeData.page
        );
    }
);


// ============================================================
// CHANNELS / ROLES
// ============================================================

async function channels() {

    DATA.channels =
        (
            await api(
                `/api/guild/${GUILD.id}/channels`
            )
        ).channels;

    return DATA.channels;
}


async function roles() {

    DATA.roles =
        (
            await api(
                `/api/guild/${GUILD.id}/roles`
            )
        ).roles;

    return DATA.roles;
}


// ============================================================
// PANELS
// ============================================================

async function renderPanels() {

    const data =
        await api(
            `/api/guild/${GUILD.id}/panels`
        );

    DATA.channels =
        DATA.channels ||
        [];

    content.innerHTML = `

        <h1 class="title">
            Panels for Server
            ${esc(GUILD.name)}
        </h1>

        <p class="subtitle">
            View and manage all panels and multi-panels
        </p>

        <div class="card">

            <div class="cardhead">

                <h2>
                    Panels
                </h2>

                <div class="actions">

                    <button
                        class="secondary"
                    >
                        ◉ Browse Gallery
                    </button>

                    <button
                        class="primary"
                        onclick="panelModal()"
                    >
                        ＋ Create Panel
                    </button>

                </div>

            </div>

            <div class="body">

                <p>
                    You've used
                    <b>
                        ${data.panels.length}
                    </b>
                    out of
                    <b>
                        3
                    </b>
                    panels
                </p>

                ${
                    data.panels.length
                        ? `

                            <div class="panelrow head">

                                <div>
                                    CHANNEL
                                </div>

                                <div>
                                    PANEL NAME
                                </div>

                                <div>
                                    STATUS
                                </div>

                                <div>
                                    MESSAGE
                                </div>

                                <div>
                                    ACTION
                                </div>

                            </div>

                            ${data.panels.map(
                                panel => `

                                    <div class="panelrow">

                                        <div>
                                            #${
                                                esc(
                                                    (
                                                        DATA.channels.find(
                                                            channel =>
                                                                channel.id ===
                                                                panel.channelId
                                                        ) ||
                                                        {}
                                                    ).name ||
                                                    panel.channelId ||
                                                    "—"
                                                )
                                            }
                                        </div>

                                        <div>
                                            <b>
                                                ${esc(panel.name)}
                                            </b>
                                        </div>

                                        <div>

                                            <span class="badge">
                                                ${esc(
                                                    panel.status ||
                                                    "24/7"
                                                )}
                                            </span>

                                        </div>

                                        <div>
                                            ${
                                                panel.messageId
                                                    ? "Sent"
                                                    : "—"
                                            }
                                        </div>

                                        <div>

                                            <button
                                                class="smallbtn"
                                                onclick="
                                                    editPanel(
                                                        '${panel.id}'
                                                    )
                                                "
                                            >
                                                ⋮
                                            </button>

                                        </div>

                                    </div>
                                `
                            ).join("")}

                        `
                        : `

                            <div class="empty">

                                ▱

                                <h3>
                                    No panels yet
                                </h3>

                                <p>
                                    Create a panel and it
                                    will be sent automatically
                                    to Discord.
                                </p>

                            </div>
                        `
                }

            </div>

        </div>


        <div class="card">

            <div class="cardhead">

                <h2>
                    Multi-Panels
                </h2>

                <button
                    class="secondary"
                    disabled
                >
                    ＋ Create Multi-Panel
                </button>

            </div>

            <div class="empty">

                ▱

                <h3>
                    No multi-panels yet
                </h3>

                <p>
                    Multi-panels combine multiple
                    panels into a single message.
                </p>

            </div>

        </div>
    `;

    await channels();
}


async function panelModal(
    existing = null
) {

    const channelList =
        await channels();

    const roleList =
        await roles();

    const panel =
        existing || {

            name:
                "Ticket Panel",

            title:
                "Need Help?",

            description:
                "Click the button below to open a ticket.",

            color:
                "#5865F2",

            footer:
                "Ticket Support",

            buttonLabel:
                "Open Ticket",

            buttonEmoji:
                "🎫",

            buttonStyle:
                "Primary",

            channelId:
                "",

            categoryId:
                GUILD.setup?.categoryId ||
                "",

            supportRoleId:
                GUILD.setup?.supportRoleId ||
                ""
        };

    modal.innerHTML = `

        <div class="modalbox">

            <div class="modalhead">

                <h2>
                    ${
                        existing
                            ? "Edit Panel"
                            : "Create Panel"

async function editPanel(
    id
) {

    const data =
        await api(
            `/api/guild/${GUILD.id}/panels`
        );

    const panel =
        data.panels.find(
            x =>
                x.id === id
        );

    panelModal(
        panel
    );
}


async function savePanel(
    id
) {

    const body = {

        name:
            val("pn"),

        channelId:
            val("pc"),

        title:
            val("pt"),

        description:
            val("pd"),

        color:
            val("pco"),

        footer:
            val("pf"),

        buttonLabel:
            val("pbl"),

        buttonEmoji:
            val("pbe"),

        categoryId:
            val("pca"),

        supportRoleId:
            val("pr")
    };

    try {

        await api(

            `/api/guild/${GUILD.id}/panels${
                id
                    ? "/" + id
                    : ""
            }`,

            {

                method:
                    id
                        ? "PATCH"
                        : "POST",

                body:
                    JSON.stringify(
                        body
                    )
            }
        );

        closeModal();

        toast(
            id
                ? "Panel updated"
                : "Panel created and sent to Discord"
        );

        renderPanels();

    } catch (error) {

        toast(
            error.message
        );
    }
}

async function blackUser() {

    const id =
        prompt(
            "User ID"
        );

    if (!id) {
        return;
    }

    await api(
        `/api/guild/${GUILD.id}/blacklist/user`,
        {

            method:
                "POST",

            body:
                JSON.stringify({
                    userId:
                        id
                })
        }
    );

    renderBlacklist();
}


async function blackRole() {

    const input =
        prompt(
            DATA.roles
                .map(
                    (role, index) =>
                        `${index}: ${role.name}`
                )
                .join("\n")
        );

    if (input === null) {
        return;
    }

    const role =
        DATA.roles[
            Number(input)
        ];

    if (!role) {
        return;
    }

    await api(
        `/api/guild/${GUILD.id}/blacklist/role`,
        {

            method:
                "POST",

            body:
                JSON.stringify({
                    roleId:
                        role.id
                })
        }
    );

    renderBlacklist();
}


async function unblack(
    kind,
    id
) {

    await api(
        `/api/guild/${GUILD.id}/blacklist/${kind}/${id}`,
        {

            method:
                "DELETE"
        }
    );

    renderBlacklist();
}

                </p>

                <p>
                    Transcripts:
                    <code>
                        ${
                            GUILD.setup?.transcriptChannelId ||
                            "Not configured"
                        }
                    </code>
                </p>

                <button
                    class="primary"
                    onclick="runSetup()"
                >
                    ✓ Run /setup
                </button>

            </div>

        </div>
    `;
}


async function runSetup() {

    await api(
        `/api/guild/${GUILD.id}/setup`,
        {
            method:
                "POST"
        }
    );

    GUILD = {

        ...GUILD,

        ...(
            await api(
                `/api/guild/${GUILD.id}`
            )
        ).guild
    };

    toast(
        "Setup complete"
    );

    renderSettings();
}


// ============================================================
// START
// ============================================================

boot();

</script>
