<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tickets | Bảng Điều Khiển</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#0f192b;
    color:#f5f7fb;
}

body{
    overflow-x:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

:root{
    --bg:#0f192b;
    --sidebar:#1b283b;
    --sidebar2:#202f43;
    --card:#1e2b3e;
    --card2:#202f43;
    --input:#3a485d;
    --line:#34445a;
    --blue:#2166f3;
    --blue2:#3c7cff;
    --green:#19a463;
    --red:#e53935;
    --yellow:#d59a20;
    --muted:#aebbd0;
    --white:#ffffff;
}

/* =========================
   CHUNG
========================= */

.hidden{
    display:none !important;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:13px;
}

code{
    background:#111a29;
    padding:3px 7px;
    border-radius:5px;
    color:#cbd8ea;
}

a{
    color:#7ba5ff;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================
   LOGIN
========================= */

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at 50% 15%,
            #1b3159 0,
            #111c30 40%,
            #080e18 100%
        );
}

.loginbox{
    width:min(450px,94vw);
    padding:42px;
    background:#181f2c;
    border:1px solid #39485c;
    border-radius:16px;
    text-align:center;
    box-shadow:0 25px 80px #0009;
}

.logo{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#5865f2;
    font-size:40px;
    font-weight:900;
}

.loginbox h1{
    margin:24px 0 10px;
    font-size:30px;
}

.loginbox p{
    color:#b7c4d8;
    line-height:1.7;
}

.loginbtn{
    width:100%;
    margin-top:20px;
}

/* =========================
   BUTTON
========================= */

.primary{
    background:#2166f3;
    color:#fff;
    padding:11px 17px;
    border-radius:6px;
    font-weight:700;
}

.primary:hover{
    background:#3477ff;
}

.secondary{
    background:#4a586d;
    color:#fff;
    padding:11px 17px;
    border-radius:6px;
    font-weight:700;
}

.secondary:hover{
    background:#59687d;
}

.success{
    background:#12844d;
    color:#fff;
    padding:11px 17px;
    border-radius:6px;
    font-weight:700;
}

.success:hover{
    background:#159a5a;
}

.danger{
    background:#e32929;
    color:#fff;
    padding:9px 14px;
    border-radius:6px;
    font-weight:700;
}

.warning{
    background:#a66e08;
    color:#fff;
    padding:9px 14px;
    border-radius:6px;
}

.smallbtn{
    background:#46546a;
    color:#fff;
    padding:8px 11px;
    border-radius:5px;
}

.iconbtn{
    width:38px;
    height:38px;
    border-radius:7px;
    background:#3b4a60;
    color:#fff;
}

.iconbtn:hover{
    background:#4d5d73;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:80px;
    background:#1c293b;
    border-right:1px solid #2d3c50;
    z-index:100;
}

.brand{
    height:82px;
    display:grid;
    place-items:center;
    font-size:26px;
    border-bottom:1px solid #2d3b4f;
}

.nav{
    padding-top:8px;
}

.nav-item{
    position:relative;
    width:100%;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    color:#fff;
    font-size:22px;
    border-left:3px solid transparent;
}

.nav-item:hover,
.nav-item.active{
    background:#26364b;
    border-left-color:#2775ff;
}

.nav-item::after{
    content:attr(data-tooltip);
    position:absolute;
    left:72px;
    top:50%;
    transform:translateY(-50%) translateX(-5px);
    background:#111827;
    border:1px solid #47566b;
    color:#fff;
    padding:8px 12px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.15s ease;
    box-shadow:0 8px 25px #0008;
    z-index:1000;
}

.nav-item:hover::after{
    opacity:1;
    visibility:visible;
    transform:translateY(-50%) translateX(0);
}

.main{
    margin-left:80px;
    width:calc(100% - 80px);
    min-height:100vh;
}

.topbar{
    height:72px;
    background:#111c2e;
    border-bottom:1px solid #29384d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:50;
}

.server-select{
    min-width:290px;
    background:#35445a;
    color:#fff;
    border:1px solid #506078;
    padding:10px 13px;
    border-radius:6px;
    outline:none;
}

.server-select:focus{
    border-color:#628cff;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.user-name{
    font-weight:700;
}

.content{
    max-width:1180px;
    margin:auto;
    padding:32px 30px 80px;
}

.page-title{
    text-align:center;
    font-size:31px;
    margin:8px 0 8px;
}

.page-subtitle{
    text-align:center;
    color:#b8c5d7;
    margin:0 0 34px;
}

/* =========================
   CARD
========================= */

.card{
    background:#1e2b3e;
    border:1px solid #26374d;
    border-radius:12px;
    overflow:hidden;
    margin:20px 0;
}

.card-header{
    min-height:60px;
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid #35455b;
}

.card-header h2{
    margin:0;
    font-size:21px;
}

.card-body{
    padding:20px;
}

.actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th{
    background:#39485d;
    color:#fff;
    font-size:13px;
    text-align:left;
    padding:14px 16px;
    white-space:nowrap;
}

.table td{
    padding:15px 16px;
    border-bottom:1px solid #344359;
    color:#eef3fa;
}

.table tr:hover td{
    background:#24344a;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    background:#2456a0;
    border-radius:5px;
    font-size:12px;
    font-weight:700;
}

.badge.green{
    background:#168451;
}

.badge.red{
    background:#a52d2d;
}

.badge.gray{
    background:#586679;
}

/* =========================
   FORM
========================= */

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#fff;
    font-weight:600;
}

.input,
.select,
.textarea{
    width:100%;
    background:#3a485d;
    border:1px solid #56657a;
    color:#fff;
    border-radius:5px;
    padding:11px 13px;
    outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:#6f96f7;
    box-shadow:0 0 0 2px #2166f322;
}

.textarea{
    min-height:180px;
    resize:vertical;
}

.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.grid4{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.filter-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

/* =========================
   SERVER
========================= */

.server-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.server-card{
    background:#1e2b3e;
    border:1px solid #2d3d53;
    border-radius:12px;
    padding:20px;
}

.server-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.server-icon{
    width:64px;
    height:64px;
    border-radius:12px;
    object-fit:cover;
}

.server-card h2{
    margin:0 0 7px;
}

.server-status{
    color:#b8c5d7;
}

/* =========================
   PANEL LIST
========================= */

.panel-row{
    display:grid;
    grid-template-columns:1.2fr 1.5fr .7fr .8fr auto;
    gap:8px;
    align-items:center;
    padding:15px 8px;
    border-bottom:1px solid #344359;
}

.panel-row.head{
    color:#b8c5d7;
    font-size:12px;
    text-transform:uppercase;
    font-weight:700;
}

.panel-row:last-child{
    border-bottom:0;
}

/* =========================
   EMPTY
========================= */

.empty{
    min-height:230px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#aebbd0;
    text-align:center;
    padding:30px;
}

.empty-icon{
    font-size:55px;
    opacity:.35;
    margin-bottom:15px;
}

.empty h3{
    color:#fff;
    margin:5px 0 8px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:grid;
    place-items:center;
    padding:20px;
    z-index:1000;
}

.modal-box{
    width:min(1000px,96vw);
    max-height:92vh;
    overflow:auto;
    background:#1b2739;
    border:1px solid #45566e;
    border-radius:10px;
    box-shadow:0 30px 100px #000c;
}

.modal-header{
    padding:18px 20px;
    border-bottom:1px solid #3b4a60;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    background:#1b2739;
    z-index:3;
}

.modal-header h2{
    margin:0;
}

.modal-body{
    padding:20px;
}

.close-x{
    width:36px;
    height:36px;
    background:transparent;
    color:#fff;
    font-size:24px;
    border-radius:6px;
}

.close-x:hover{
    background:#334258;
}

/* =========================
   PANEL CREATE SECTIONS
========================= */

.panel-section{
    border:1px solid #34445a;
    background:#202e42;
    border-radius:9px;
    margin-bottom:18px;
    overflow:hidden;
}

.panel-section-header{
    padding:17px 18px;
    border-bottom:1px solid #394a60;
}

.panel-section-header h3{
    margin:0 0 5px;
    font-size:20px;
}

.panel-section-header p{
    margin:0;
    color:#b4c1d4;
    font-size:13px;
}

.panel-section-body{
    padding:20px;
}

.preview-box{
    background:#2b2f34;
    border-left:4px solid #5865f2;
    border-radius:4px;
    padding:18px;
    min-height:180px;
}

.preview-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:12px;
}

.preview-description{
    white-space:pre-wrap;
    line-height:1.6;
    color:#f0f2f5;
}

.preview-footer{
    margin-top:22px;
    padding-top:12px;
    border-top:1px solid #51565d;
    color:#9ca5b4;
    font-size:12px;
}

.preview-button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#5865f2;
    color:#fff;
    padding:9px 14px;
    border-radius:5px;
    margin-top:14px;
    font-weight:700;
}

/* =========================
   TRANSCRIPT VIEW
========================= */

.transcript-message{
    padding:14px 0;
    border-bottom:1px solid #344359;
}

.transcript-message:last-child{
    border-bottom:0;
}

.transcript-user{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:7px;
}

.transcript-user img{
    width:34px;
    height:34px;
    border-radius:50%;
}

.transcript-content{
    margin-left:44px;
    white-space:pre-wrap;
    color:#e9edf4;
}

.transcript-time{
    color:#8896aa;
    font-size:12px;
}

/* =========================
   TOOLTIP CHUNG
========================= */

.tooltip{
    position:relative;
}

.tooltip::after{
    content:attr(data-tooltip);
    position:absolute;
    left:50%;
    bottom:calc(100% + 8px);
    transform:translateX(-50%);
    background:#101827;
    border:1px solid #46566b;
    color:#fff;
    padding:7px 10px;
    border-radius:5px;
    font-size:12px;
    white-space:nowrap;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.15s;
    z-index:999;
}

.tooltip:hover::after{
    opacity:1;
    visibility:visible;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    max-width:400px;
    background:#202e42;
    border:1px solid #53637a;
    color:#fff;
    padding:14px 18px;
    border-radius:7px;
    z-index:3000;
    box-shadow:0 15px 40px #0008;
}

.toast.success-toast{
    border-color:#1ca866;
}

.toast.error-toast{
    border-color:#df3b3b;
}

/* =========================
   LOADING
========================= */

.loading{
    min-height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#b8c5d7;
    font-size:16px;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #45566c;
    border-top-color:#4e82ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-right:12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .sidebar{
        width:62px;
    }

    .main{
        margin-left:62px;
        width:calc(100% - 62px);
    }

    .nav-item{
        height:58px;
    }

    .nav-item::after{
        left:57px;
    }

    .topbar{
        padding:0 12px;
    }

    .server-select{
        min-width:180px;
    }

    .content{
        padding:22px 14px 60px;
    }

    .grid2,
    .grid3,
    .grid4,
    .filter-grid{
        grid-template-columns:1fr;
    }

    .server-grid{
        grid-template-columns:1fr;
    }

    .panel-row{
        grid-template-columns:1fr;
        gap:5px;
    }

    .panel-row.head{
        display:none;
    }

    .user-name{
        display:none;
    }
}

@media(max-width:600px){

    .brand{
        height:65px;
    }

    .topbar{
        height:64px;
    }

    .page-title{
        font-size:24px;
    }

    .server-select{
        min-width:140px;
        max-width:65vw;
    }

    .loginbox{
        padding:28px 20px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="loginbox">

        <div class="logo">🎫</div>

        <h1>Tickets Dashboard</h1>

        <p>
            Quản lý hệ thống Ticket, Panel, Transcript,
            Team và máy chủ Discord của bạn.
        </p>

        <button
            class="primary loginbtn"
            onclick="loginDiscord()"
        >
            🎮 Đăng nhập bằng Discord
        </button>

        <p class="small" style="margin-top:18px">
            Phiên đăng nhập sẽ được lưu trên trình duyệt.
        </p>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app" class="app hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            🎫
        </div>

        <div class="nav">

            <button
                class="nav-item"
                data-page="tickets"
                data-tooltip="Tickets — Vé hỗ trợ đang mở"
            >
                🎟️
            </button>

            <button
                class="nav-item"
                data-page="transcripts"
                data-tooltip="Transcript — Lịch sử Ticket đã đóng"
            >
                🧾
            </button>

            <button
                class="nav-item"
                data-page="panels"
                data-tooltip="Panels — Tạo và chỉnh Panel Ticket"
            >
                ▣
            </button>

            <button
                class="nav-item"
                data-page="teams"
                data-tooltip="Teams — Quản lý đội hỗ trợ"
            >
                👥
            </button>

            <button
                class="nav-item"
                data-page="blacklist"
                data-tooltip="Blacklist — Chặn người dùng / role"
            >
                ⊘
            </button>

            <button
                class="nav-item"
                data-page="audit-log"
                data-tooltip="Audit Log — Nhật ký quản trị"
            >
                ↶
            </button>

            <button
                class="nav-item"
                data-page="settings"
                data-tooltip="Cài đặt — Setup hệ thống Ticket"
            >
                ⚙
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <select
                id="serverSelect"
                class="server-select tooltip"
                data-tooltip="Chọn máy chủ Discord muốn quản lý"
            ></select>

            <div class="user-area">

                <img
                    id="userAvatar"
                    class="avatar"
                    src="https://cdn.discordapp.com/embed/avatars/0.png"
                >

                <span
                    id="userName"
                    class="user-name"
                >
                    Đang tải...
                </span>

                <button
                    class="iconbtn tooltip"
                    data-tooltip="Đăng xuất"
                    onclick="logout()"
                >
                    ⇥
                </button>

            </div>

        </header>


        <section
            id="content"
            class="content"
        ></section>

    </main>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal hidden"
></div>


<!-- TOAST -->

<div
    id="toast"
    class="toast hidden"
></div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API = "https://imcongthienzz.freesrv.com";

let TOKEN =
    localStorage.getItem("dashboard_token") || "";

let ME = null;
let GUILDS = [];
let GUILD = null;

let DATA = {
    channels: [],
    roles: [],
    teams: []
};


/* =====================================================
   ELEMENTS
===================================================== */

const $ = id =>
    document.getElementById(id);

const content =
    $("content");

const modal =
    $("modal");

const toastBox =
    $("toast");

const serverSelect =
    $("serverSelect");

const userName =
    $("userName");

const userAvatar =
    $("userAvatar");


/* =====================================================
   HELPER
===================================================== */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[char]));

}


function value(id){

    return $(id)?.value || "";

}


function checked(id){

    return !!$(id)?.checked;

}


function setChecked(id,state){

    if($(id)){
        $(id).checked = !!state;
    }

}


/* =====================================================
   TOAST
===================================================== */

function toast(message,type="normal"){

    toastBox.textContent =
        message;

    toastBox.classList.remove(
        "hidden",
        "success-toast",
        "error-toast"
    );

    if(type==="success"){
        toastBox.classList.add(
            "success-toast"
        );
    }

    if(type==="error"){
        toastBox.classList.add(
            "error-toast"
        );
    }

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            ()=>{
                toastBox.classList.add(
                    "hidden"
                );
            },
            3000
        );

}


/* =====================================================
   API
===================================================== */

async function api(path,options={}){

    const headers = {
        ...(options.headers || {}),
        "Content-Type":"application/json"
    };

    if(TOKEN){

        headers.Authorization =
            "Bearer " + TOKEN;

    }

    let response;

    try{

        response =
            await fetch(
                API + path,
                {
                    ...options,
                    headers
                }
            );

    }catch(error){

        throw new Error(
            "Không thể kết nối tới máy chủ Dashboard."
        );

    }


    let data = {};

    try{

        data =
            await response.json();

    }catch{

        data = {};

    }


    if(!response.ok){

        if(response.status === 401){

            /*
             * Chỉ xóa phiên khi server thực sự
             * báo 401.
             *
             * Không xóa token khi lỗi mạng,
             * lỗi 500 hoặc lỗi tạm thời.
             */

            TOKEN = "";

            localStorage.removeItem(
                "dashboard_token"
            );

        }

        throw new Error(
            data.error ||
            "Yêu cầu không thành công."
        );

    }

    return data;

}

/* =====================================================
   AUTH CALLBACK
===================================================== */

function readAuthFromUrl(){

    const hash =
        window.location.hash
            .replace(/^#/,"");

    if(hash.startsWith("auth=")){

        const token =
            hash.substring(5);

        if(token){

            TOKEN = token;

            /*
             * Lưu phiên đăng nhập.
             * Backend hiện tại cấp token 7 ngày.
             */

            localStorage.setItem(
                "dashboard_token",
                TOKEN
            );

            /*
             * Xóa token khỏi thanh địa chỉ.
             */

            history.replaceState(
                null,
                document.title,
                window.location.pathname +
                window.location.search
            );

        }

    }


    if(hash.startsWith("error=")){

        const error =
            hash.substring(6);

        history.replaceState(
            null,
            document.title,
            window.location.pathname
        );

        toast(
            "Đăng nhập Discord thất bại: " +
            error,
            "error"
        );

    }

}

        parts[1]
    ){

        return {
            guildId:parts[1],
            page:parts[2] || "panels"
        };

    }

    return {

    };

}

/* =====================================================
   SELECT SERVER
===================================================== */

async function selectGuild(
    guildId,
    redirect=true
){

    const guild =
        GUILDS.find(
            x => x.id === guildId
        );

    if(!guild){

        renderServers();

        return;

    }

    if(!guild.botInstalled){

        toast(
            "Bot chưa vào server này.",
            "error"
        );

        return;

    }


    try{

        const data =
            await api(
                `/api/guild/${guild.id}`
            );

        GUILD = {
            ...guild,
            ...data.guild
        };

        serverSelect.value =
            guild.id;

        showApp();

        if(redirect){

            go("panels");

        }

    }catch(error){

        toast(
            error.message,
            "error"
        );

    }

}

        .forEach(

                    "active",
                    item.dataset.page === page
                );

            }
        );


    const pages = {

        tickets:renderTickets,

        transcripts:renderTranscripts,

        panels:renderPanels,

        teams:renderTeams,

        blacklist:renderBlacklist,

    const renderer =
        pages[page] ||

/* =====================================================
   SAVE PANEL
===================================================== */

async function savePanel(id){

    const channelId =
        value("pchannel");


    if(!channelId){

        toast(
            "Hãy chọn kênh gửi Panel.",
            "error"
        );

        return;

    }


    const payload = {

        name:
            value("pname") ||
            "Ticket Panel",

        channelId,

        title:
            value("ptitle") ||
            "Mở một Ticket",

        description:
            value("pdescription") ||
            "Nhấn nút bên dưới để mở một Ticket.",

        color:
            value("pcolor") ||
            "#5865F2",

        footer:
            value("pfooter") ||
            "Hệ thống hỗ trợ Ticket",

        buttonLabel:
            value("pbutton") ||
            "Mở Ticket",

        buttonEmoji:
            value("pemoji") ||
            "🎫",

        buttonStyle:
            value("pstyle") ||
            "Primary",

        categoryId:
            value("pcategory") ||
            "",

        supportRoleId:
            value("prole") ||
            "",

        status:"24/7",

        thumbnailUrl:
            value("pthumbnail"),

        imageUrl:
            value("pimage"),

        disablePanel:
            checked("pdisable"),

        supportTeams:
            value("psupportteam"),

        knowledgeBaseCategories:
            value("pknowledge"),

        awaitingResponseCategoryId:
            value("pawaiting"),

        transcriptChannelId:
            value("ptranscript"),

        mentionRoleId:
            value("pmentionrole"),

        mentionBehaviour:
            value("pmentionbehavior"),

        enableTranscripts:
            checked("penabletranscript"),

        enableClaim:
            checked("penableclaim"),

        enableCloseWithReason:
            checked("penableclose"),

        enableForm:
            checked("penableform"),

        welcomeTitle:
            value("pwelcometitle"),

        welcomeMessage:
            value("pwelcomemessage"),

        welcomeColor:
            value("pwelcomecolor")

    };


    try{

        if(id){

            await api(
                `/api/guild/${GUILD.id}/panels/${id}`,
                {
                    method:"PATCH",
                    body:JSON.stringify(payload)
                }
            );

            toast(
                "Đã cập nhật Panel trên Discord.",
                "success"
            );

        }else{

            await api(
                `/api/guild/${GUILD.id}/panels`,
                {
                    method:"POST",
                    body:JSON.stringify(payload)
                }
            );

            toast(
                "Đã tạo Panel và gửi vào Discord.",
                "success"
            );

        }


        closeModal();

        await renderPanels();

    }catch(error){

        toast(
            error.message,
            "error"
        );

    }

}

async function deletePanel(id){

    if(

    try{

        await api(
            `/api/guild/${GUILD.id}/panels/${id}`,
            {
                method:"DELETE"
            }
        );

        closeModal();

        toast(
            "Đã xóa Panel.",
            "success"
        );

        renderPanels();

    }catch(error){

        toast(
            error.message,
            "error"
        );

    }

}

/* =====================================================
   FILTER TICKETS
===================================================== */

function filterTickets(){

    const tickets =
        window.__tickets || [];


    const id =
        value("ticketFilterId")
            .toLowerCase();

    const username =
        value("ticketFilterUser")
            .toLowerCase();

    const userId =
        value("ticketFilterUserId")
            .toLowerCase();

    const claimed =
        value("ticketFilterClaim")
            .toLowerCase();


    let list =
        tickets.filter(
            ticket => {

                if(
                    id &&
                    !String(ticket.id)
                        .toLowerCase()
                        .includes(id)
                )
                    return false;


                if(
                    username &&
                    !String(ticket.username || "")
                        .toLowerCase()
                        .includes(username)
                )
                    return false;


                if(
                    userId &&
                    !String(ticket.userId || "")
                        .toLowerCase()
                        .includes(userId)
                )
                    return false;


                if(
                    claimed &&
                    !String(ticket.claimedById || "")
                        .toLowerCase()
                        .includes(claimed)
                )
                    return false;


                if(
                    checked("onlyUnclaimed") &&
                    ticket.claimedById
                )
                    return false;


                return true;

            }
        );


    if(
        checked("awaitingFirst")
    ){

        list.sort(
            (a,b) =>
                Number(!a.claimedById) -
                Number(!b.claimedById)
        );

    }


    $("ticketsTable").innerHTML = `

        <table class="table">

            <thead>

                <tr>

                    <th>Ticket ID</th>

                    <th>Tên người dùng</th>

                    <th>ID người dùng</th>

                    <th>Claim bởi</th>

                    <th>Trạng thái</th>

                    <th>Thao tác</th>

                </tr>

            </thead>


            <tbody>

                ${
                    list.length
                    ?
                    list.map(
                        ticket => `

                        <tr>

                            <td>
                                <b>${esc(ticket.id)}</b>
                            </td>

                            <td>
                                ${esc(ticket.username)}
                            </td>

                            <td>
                                ${esc(ticket.userId)}
                            </td>

                            <td>
                                ${
                                    ticket.claimedById
                                    ? esc(ticket.claimedById)
                                    : `
                                        <span class="badge gray">
                                            Chưa Claim
                                        </span>
                                      `
                                }
                            </td>

                            <td>
                                <span class="badge green">
                                    Đang mở
                                </span>
                            </td>

                            <td>

                                <a
                                    target="_blank"
                                    href="
                                        https://discord.com/channels/
                                        ${GUILD.id}/
                                        ${ticket.channelId}
                                    "
                                >
                                    👁️ Mở Discord
                                </a>

                            </td>

                        </tr>

                        `
                    ).join("")
                    :
                    `
                    <tr>

                        <td
                            colspan="6"
                            class="empty"
                        >
                            Không có Ticket phù hợp.
                        </td>

                    </tr>
                    `
                }

            </tbody>

        </table>

    `;

}

===================================================== */

function viewTranscript(id){

    const transcripts =
        window.__transcripts || [];


    const transcript =
        transcripts.find(
            x =>
                String(x.ticketId) ===
                String(id)
        );


    if(!transcript) return;


    const messages =
        transcript.messages || [];


    modal.innerHTML = `

        <div class="modal-box">

            <div class="modal-header">

                <h2>
                    Transcript #${esc(id)}
                </h2>

                <button
                    class="close-x"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>


            <div class="modal-body">

                <div class="card">

                    <div class="card-body">

                        <p>
                            <b>Người dùng:</b>
                            ${esc(transcript.username || "—")}
                        </p>

                        <p>
                            <b>Lý do đóng:</b>
                            ${esc(
                                transcript.closeReason ||
                                "Không có lý do"
                            )}
                        </p>

                    </div>

                </div>


                ${
                    messages.length
                    ?
                    messages.map(
                        message => `

                            <div
                                class="transcript-message"
                            >

                                ${esc(message)}

                            </div>

                        `
                    ).join("")
                    :
                    `
                    <div class="empty">

                        <div class="empty-icon">
                            🧾
                        </div>

                        <h3>
                            Không có nội dung
                        </h3>

                    </div>
                    `
                }

            </div>

        </div>

    `;


    modal.classList.remove(
        "hidden"
    );

}

/* =====================================================

===================================================== */

async function blacklistRole(){

    const roles =
        await loadRoles();


    const text =
        roles
            .map(
                (role,index) =>
                    `${index} — ${role.name}`
            )
            .join("\n");


    const input =
        prompt(
            "Nhập số của Role:\n\n" +
            text
        );


    if(input === null) return;


    const role =
        roles[
            Number(input)
        ];


    if(!role){

        toast(
            "Role không hợp lệ.",
            "error"
        );

        return;

    }


    try{

        await api(
            `/api/guild/${GUILD.id}/blacklist/role`,
            {
                method:"POST",
                body:JSON.stringify({
                    roleId:role.id
                })
            }
        );

        toast(
            "Đã chặn Role.",
            "success"
        );

        renderBlacklist();

    }catch(error){

        toast(
            error.message,
            "error"
        );

    }

}

/* =====================================================
   BOOT
===================================================== */

async function boot(){

    /*
     * Đọc token OAuth2 trước.
     */

    readAuthFromUrl();


    /*
     * Không có token -> login.
     */

    if(!TOKEN){

        showLogin();

        return;

    }


    try{

        /*
         * Kiểm tra token.
         */

        await loadMe();


        /*
         * Lấy server.
         */

        await loadGuilds();


        showApp();


        const r =
            route();


        /*
         * Nếu URL có:
         *
         * #manage/GUILD_ID/panels
         */

        if(r.guildId){

            await selectGuild(
                r.guildId,
                false
            );


            if(GUILD){

                await renderPage(
                    r.page
                );

            }

        }else{

            renderServers();

        }


    }catch(error){

        /*
         * Chỉ khi token thực sự hết hạn
         * / 401 mới bị xóa trong api().
         */

        if(!TOKEN){

            showLogin();

        }else{

            content.innerHTML = `

                <div class="card">

                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Không thể tải Dashboard
                        </h3>

                        <p>
                            ${esc(error.message)}
                        </p>

                        <div class="actions">

                            <button
                                class="primary"
                                onclick="boot()"
                            >
                                🔄 Thử lại
                            </button>

                            <button
                                class="secondary"
                                onclick="logout()"
                            >
                                ⇥ Đăng xuất
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }

    }

}
