<script>
const API = "https://imcongthienzz.freesrv.com";

async function checkLogin() {
    try {
        const response = await fetch(`${API}/api/me`, {
            method: "GET",
            credentials: "include"
        });

        if (!response.ok) {
            showLogin();
            return;
        }

        const data = await response.json();

        if (data.loggedIn) {
            showDashboard(data.user);
        } else {
            showLogin();
        }

    } catch (error) {
        console.error("Không thể kết nối backend:", error);
        showLogin();
    }
}

function loginDiscord() {
    window.location.href =
        `${API}/auth/discord`;
}

function showLogin() {
    document.body.innerHTML = `
        <div class="login-page">
            <div class="login-box">
                <div class="logo">B</div>

                <h1>Bot Manager</h1>

                <p>
                    Đăng nhập bằng Discord để quản lý bot
                    và cấu hình các server mà bot đang tham gia.
                </p>

                <button onclick="loginDiscord()">
                    🎮 Đăng nhập bằng Discord
                </button>
            </div>
        </div>
    `;
}

function showDashboard(user) {
    document.body.innerHTML = `
        <div class="dashboard">

            <header>
                <h1>Bot Manager</h1>

                <div class="user">
                    ${
                        user.avatar
                            ? `<img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png">`
                            : ""
                    }

                    <span>
                        ${
                            user.global_name ||
                            user.username
                        }
                    </span>

                    <button onclick="logout()">
                        Đăng xuất
                    </button>
                </div>
            </header>

            <main>

                <h2>Chọn Server</h2>

                <p>
                    Chọn server Discord mà bạn muốn quản lý.
                </p>

                <div id="guilds">
                    Đang tải server...
                </div>

            </main>

        </div>
    `;

    loadGuilds();
}

async function loadGuilds() {
    const container =
        document.getElementById("guilds");

    try {

        const response =
            await fetch(`${API}/api/guilds`, {
                credentials: "include"
            });

        if (!response.ok) {
            container.innerHTML =
                "<p>❌ Không thể lấy danh sách server.</p>";
            return;
        }

        const data =
            await response.json();

        if (!data.guilds || data.guilds.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>Không có server</h3>
                    <p>
                        Bạn không có quyền quản lý server
                        hoặc bot chưa được thêm vào server.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML =
            data.guilds.map(guild => `
                <div class="guild-card">

                    ${
                        guild.icon
                            ? `<img src="${guild.icon}">`
                            : `<div class="guild-icon">🛡️</div>`
                    }

                    <div class="guild-info">
                        <h3>${escapeHTML(guild.name)}</h3>

                        <span>
                            ${
                                guild.botInstalled
                                    ? "🟢 Bot đang ở server"
                                    : "🔴 Bot chưa ở server"
                            }
                        </span>
                    </div>

                    ${
                        guild.botInstalled
                            ? `
                                <button
                                    onclick="openGuild('${guild.id}')"
                                >
                                    Quản lý
                                </button>
                            `
                            : `
                                <button
                                    onclick="inviteBot('${guild.id}')"
                                >
                                    Thêm Bot
                                </button>
                            `
                    }

                </div>
            `).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>❌ Lỗi kết nối backend.</p>";
    }
}

function openGuild(guildId) {

    window.location.href =
        `?guild=${encodeURIComponent(guildId)}`;
}

function inviteBot(guildId) {

    window.location.href =
        `https://discord.com/oauth2/authorize?client_id=1532642645862518874&permissions=8&scope=bot%20applications.commands&guild_id=${guildId}`;
}

function logout() {

    window.location.href =
        `${API}/auth/logout`;
}

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

// ============================================================
// START
// ============================================================

checkLogin();
</script>
